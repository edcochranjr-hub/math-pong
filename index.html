const TAU = Math.PI * 2;
const rand = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const randF = (a, b) => Math.random() * (b - a) + a;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeInOut = t => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;

function pickWeighted(arr, weights) {
  const total = weights.reduce((a,b)=>a+b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < arr.length; i++) { r -= weights[i]; if (r <= 0) return arr[i]; }
  return arr[arr.length-1];
}

// === PERSISTENCE (localStorage) ===
const LS_KEY = 'mathPongV2';
function loadStore() {
  try { const s = localStorage.getItem(LS_KEY); return s ? JSON.parse(s) : {}; } catch (e) { return {}; }
}
function saveStore() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch (e) {}
}
const store = loadStore();
store.names = store.names || { left: 'PLAYER 1', right: 'PLAYER 2' };
store.stats = store.stats || { totalSolved: 0, bestStreak: 0, gamesPlayed: 0, weakSpots: {} };
store.muted = !!store.muted;
// Multiple choice defaults: ON for touch devices (mobile/tablet) on first run
// since they have no keyboard for typing answers; OFF for desktop. After the
// user toggles it manually, we respect that choice.
const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
if (typeof store.multiChoice === 'undefined') {
  store.multiChoice = isTouchDevice;
} else {
  store.multiChoice = !!store.multiChoice;
}
store.customSetup = store.customSetup || {
  ops: { add: true, sub: true, mul: false, div: false, pow: false, alg: false },
  difficulty: 2,
};
// Persistent rolling buffer of recently-seen problem texts. Used to avoid
// repetition across sessions, especially at low complexity where the problem
// space is small (1-9 add has only 81 possibilities).
store.recentProblems = Array.isArray(store.recentProblems) ? store.recentProblems : [];
// Head-to-head records, keyed { [winnerName]: { [loserName]: winCount } }.
// Lookup symmetric pair: store.records.TREY?.MIMI vs store.records.MIMI?.TREY.
store.records = store.records || {};
saveStore();

function recordResult(winnerName, loserName) {
  // Skip generic defaults — H2H is only meaningful for named players.
  const generic = (n) => !n || n === 'PLAYER 1' || n === 'PLAYER 2';
  if (generic(winnerName) || generic(loserName)) return;
  store.records[winnerName] = store.records[winnerName] || {};
  store.records[winnerName][loserName] = (store.records[winnerName][loserName] || 0) + 1;
  saveStore();
}

function getH2H(nameA, nameB) {
  const generic = (n) => !n || n === 'PLAYER 1' || n === 'PLAYER 2';
  if (generic(nameA) || generic(nameB)) return null;
  const aWins = (store.records[nameA] || {})[nameB] || 0;
  const bWins = (store.records[nameB] || {})[nameA] || 0;
  if (aWins === 0 && bWins === 0) return null;
  return { nameA, nameB, aWins, bWins };
}

// === AUDIO ===
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur = 0.12, type = 'square', vol = 0.16) {
  if (store.muted || !audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.connect(g);
  g.connect(audioCtx.destination);
  o.start();
  o.stop(audioCtx.currentTime + dur);
}
const sfx = {
  type:      () => beep(660, 0.04, 'square', 0.06),
  correct:   () => { beep(660, 0.08, 'square'); setTimeout(()=>beep(990,0.12,'square'), 60); setTimeout(()=>beep(1320,0.12,'square'), 130); },
  wrong:     () => { beep(180, 0.18, 'sawtooth', 0.22); setTimeout(()=>beep(120,0.22,'sawtooth',0.22), 100); },
  hit:       () => beep(520, 0.08, 'triangle', 0.18),
  score:     () => { beep(880, 0.1); setTimeout(()=>beep(1320,0.12), 80); setTimeout(()=>beep(1760,0.18), 160); },

const game = {

  recentProblems: [...(store.recentProblems || [])],
  // Multiple-choice input mode: 4 choices per problem, pick with 1-4 keys.

  multiChoice: !!store.multiChoice,

  pong: null,

  matchStartTime: 0,

  paddleL: { x: 0, y: 0, w: 16, h: 120, color1: '#56e2ff', color2: '#3b82f6', name: store.names.left,  side: 'left',  pulse: 0, targetY: 0, vibe: 0 },

function updatePaddleNames() {
  game.paddleL.name = store.names.left;
  game.paddleR.name = game.mode === 'versus1p' ? 'CPU' : store.names.right;
}

function namesAreDefault() {
  return store.names.left === 'PLAYER 1' || store.names.right === 'PLAYER 2';
}

// Fullscreen helpers — request/exit via the Fullscreen API. Browser usually
// hides the URL bar / status bar in fullscreen, giving the game the whole
// screen. Must be triggered from a user gesture (click/tap), so we call this
// from the click handler. Silently does nothing on browsers that don't
// support it (e.g. iOS Safari pre-16 doesn't expose document fullscreen).
function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement);
}
function requestFullscreenSilent() {
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
  if (req) {
    try {
      const p = req.call(el);
      if (p && p.catch) p.catch(() => {}); // suppress rejection
    } catch (_) { /* noop */ }
  }
}
function exitFullscreenSilent() {
  const exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen;
  if (exit) {
    try {
      const p = exit.call(document);
      if (p && p.catch) p.catch(() => {});
    } catch (_) { /* noop */ }
  }
}
function toggleFullscreen() {
  if (isFullscreen()) exitFullscreenSilent();
  else requestFullscreenSilent();
}

// True when running on a touch device that's currently in portrait orientation.
// Used to nudge the user to rotate (Pong needs the width).
function isPortraitMobile() {
  return isTouchDevice && H > W * 1.05;
}

// Centralized "user wants to start the game" action. Called from SPACE keypress
// AND from the click handler (tap-to-start on touch devices).
function startGameFlow() {
  if (game.mode === 'practice') {
    game.state = STATES.PRACTICE_MENU;
  } else if (game.mode === 'custom') {
    game.state = STATES.CUSTOM_SETUP;
    game.customSetup.customMenuCursor = 0;
  } else if (game.mode === 'versus2p' && namesAreDefault()) {
    game.state = STATES.NAME_ENTRY;
    game.nameEntry = {
      side: 'left',
      text: store.names.left === 'PLAYER 1' ? 'TREY' : store.names.left,
      thenAction: 'startGame',
      suggested: true,
    };
  } else {
    startGame();
  }
}

function loadCustomSetupFromStore() {
  game.customSetup.ops = Object.assign({ add: true, sub: true, mul: false, div: false, pow: false, alg: false }, store.customSetup.ops || {});
  game.customSetup.difficulty = store.customSetup.difficulty || 2;
}
loadCustomSetupFromStore();

function persistCustomSetup() {
  store.customSetup = {
    ops: Object.assign({}, game.customSetup.ops),
    difficulty: game.customSetup.difficulty,
  };
  saveStore();
}

function placePaddles() {
  game.paddleL.x = 40;
  game.paddleL.h = clamp(H * 0.16, 90, 160);
  game.paddleL.y = H/2 - game.paddleL.h/2;
  game.paddleR.x = W - 40 - game.paddleR.w;
  game.paddleR.h = game.paddleL.h;
  game.paddleR.y = H/2 - game.paddleR.h/2;
}

function initStars() {
  game.stars = [];
  for (let i = 0; i < 220; i++) {
    game.stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      z: randF(0.2, 1),
      r: randF(0.4, 1.8),
      tw: randF(0, TAU),
    });
  }
}

function difficultyTier() {
  // Difficulty bumps every 5 correct answers. Capped at the mode's maxTier
  // (KIDS stays at 4, FAMILY at 8, GENIUS hits 9). Total correct is shared
  // across both players, so both sides see the same tier.
  const tier = Math.floor(game.totalCorrect / 5) + 1;
  return Math.min(tier, curDiff().maxTier);
}

// Extra seconds granted for problems that require real mental work beyond typing.
// Tuned so big problems always have 3-4 seconds even when the other player just
// answered fast. "Smart kid doing it in their head" — not savant pace.
function thinkingBonus(problem) {
  if (!problem) return 0;
  const op = problem.op;
  const a = Math.abs(problem.answer || 0);
  if (op === 'pow') {
    if (a > 1000) return 2.5;   // 9^4 = 6561, hard mental
    if (a > 200)  return 1.8;   // 5^3, 6^3, 7^3
    if (a > 50)   return 1.2;   // 8^2, 4^3
    return 0.8;                 // 2^3, 3^2
  }
  if (op === 'alg') {
    if (problem.algType === 'linear') return 2.5;  // two-step ax±b=c
    if (problem.algType === 'mul')    return 1.5;  // ax=c
    return 1.0;                                    // single-step
  }
  if (op === 'mul' || op === 'div') {
    if (a > 500)  return 1.8;
    if (a > 200)  return 1.4;
    if (a > 100)  return 1.1;   // 12*9=108
    if (a > 50)   return 0.8;   // 8*8=64
    if (a > 25)   return 0.5;
    return 0;
  }
  if (op === 'add' || op === 'sub') {
    if (a > 5000) return 2.0;   // 4-digit sums
    if (a > 1000) return 1.6;
    if (a > 500)  return 1.3;
    if (a > 150)  return 1.0;   // low triples
    if (a > 70)   return 0.7;   // high doubles (e.g. 84+97=181 → catches 70-150)
    if (a > 35)   return 0.5;   // mid doubles
    if (a > 15)   return 0.25;
    return 0;
  }
  return 0;
}

function nextTimeLimit(timeUsed, currentLimit, problem) {
  const d = curDiff();
  const digits = String(Math.abs(problem.answer || 0)).length;
  // Typing floor base bumped from 1.5 to 2.0 — adds an extra half-second of
  // breathing room across all answer sizes.
  const typingFloor = 2.0 + 0.4 * Math.max(0, digits - 1);
  const bonus = thinkingBonus(problem);
  const floor = Math.max(typingFloor, d.minTime) + bonus;
  const target = timeUsed + 1.0 + bonus;
  const candidate = Math.max(target, currentLimit - d.maxDrop);
  const cap = Math.max(d.maxTime + bonus, floor + 0.5);
  return clamp(candidate, floor, cap);
}

function tierName(t) {
  // Operator symbols, not aspirational labels — what's actually in the problem pool at this tier.
  return ['', '+', '+ −', '+ −', '+ − ×', '+ − ×', '+ − × ÷', '+ − × ÷', '+ − × ÷ ^', '+ − × ÷ ^  (±)'][t] || '';
}

function tierIntroducesOp(t) {
  if (t === 2) return 'sub';
  if (t === 4) return 'mul';
  if (t === 6) return 'div';
  if (t === 8) return 'pow';
  return null;
}

function opUnlockText(op) {

    mul: 'NEW:  TIMES TABLES  ×',
    div: 'NEW:  DIVISION  ÷',
    pow: 'NEW:  POWERS  ^',

}

function fmt(n, isFirst) {
  if (n < 0) return '(−' + (-n) + ')';

}

// Per-op magnitude bands. `complexity` is round/tierMult — both players use the
// same complexity at the same moment, so both sides face matching ranges.
//
// FAMILY mode (tierMult 1.4) hits triple digits around round 12 (complexity ~8.6).
// KIDS mode (mult 2.2) ramps slower; GENIUS (mult 1.0) ramps fastest.
function magnitudeFor(op, complexity) {
  const c = complexity;
  const diffKey = DIFF_KEYS[diffIdx]; // 'KIDS' | 'FAMILY' | 'GENIUS'

  // === KIDS (5-8) — strictly single-digit add/sub. Nothing else fires
  // anyway because maxTier=2, but defensive single-digit fallback for any op.
  if (diffKey === 'KIDS') {
    return { min: 1, max: 9 };
  }

  // === FAMILY (9-12) — capped per op:
  //   add  ≤ 250 (low triples)
  //   sub  ≤ 99
  //   mul  product ≤ ~99 normally; round multipliers handled in genProblem
  //   div  small division facts only
  //   pow  same exp rule as GENIUS but small bases
  if (diffKey === 'FAMILY') {
    if (op === 'add') {
      if (c <= 2.5)  return { min: 1,  max: 9 };
      if (c <= 4.5)  return { min: 2,  max: 14 };
      if (c <= 6.5)  return { min: 4,  max: 22 };
      if (c <= 8.5)  return { min: 8,  max: 35 };
      if (c <= 10.5) return { min: 12, max: 50 };
      if (c <= 12.5) return { min: 18, max: 70 };
      if (c <= 14.5) return { min: 30, max: 99 };
      if (c <= 17)   return { min: 45, max: 150 };
      return              { min: 60, max: 250 }; // hard cap at low triples
    }
    if (op === 'sub') {
      if (c <= 2.5)  return { min: 1,  max: 9 };
      if (c <= 4.5)  return { min: 2,  max: 14 };
      if (c <= 6.5)  return { min: 4,  max: 22 };
      if (c <= 8.5)  return { min: 8,  max: 35 };
      if (c <= 10.5) return { min: 12, max: 50 };
      if (c <= 12.5) return { min: 18, max: 70 };
      return              { min: 25, max: 99 }; // hard cap at 99
    }
    if (op === 'mul') {
      // Plain times tables; round multipliers (5/10/25/50/100) injected in genProblem.
      if (c <= 4)  return { aMin: 2, aMax: 5, bMin: 2, bMax: 4 };
      if (c <= 6)  return { aMin: 2, aMax: 6, bMin: 2, bMax: 5 };
      if (c <= 8)  return { aMin: 2, aMax: 7, bMin: 2, bMax: 6 };
      if (c <= 10) return { aMin: 2, aMax: 8, bMin: 2, bMax: 7 };
      return            { aMin: 2, aMax: 9, bMin: 2, bMax: 9 }; // 9×9 = 81
    }
    if (op === 'div') {
      if (c <= 5)  return { qMin: 2, qMax: 5, dMin: 2, dMax: 4 };
      if (c <= 7)  return { qMin: 2, qMax: 6, dMin: 2, dMax: 5 };
      if (c <= 9)  return { qMin: 2, qMax: 7, dMin: 2, dMax: 6 };
      return            { qMin: 2, qMax: 9, dMin: 2, dMax: 9 };
    }
    if (op === 'pow') {
      // Single-digit bases. Exponent rule applied in genProblem:
      //   base < 5 → exp up to 4   (max 4^4 = 256)
      //   base ≥ 5 → exp up to 3   (max 9^3 = 729)
      if (c <= 28) return { baseMin: 2, baseMax: 4 };
      if (c <= 32) return { baseMin: 2, baseMax: 6 };
      return            { baseMin: 2, baseMax: 9 };
    }
  }

  // === GENIUS (13+) — full smooth ramp ===
  if (op === 'add' || op === 'sub') {
    if (c <= 2.5)  return { min: 1,    max: 9 };
    if (c <= 4.5)  return { min: 2,    max: 14 };
    if (c <= 6.5)  return { min: 4,    max: 22 };
    if (c <= 8.5)  return { min: 8,    max: 35 };
    if (c <= 10.5) return { min: 12,   max: 50 };
    if (c <= 12.5) return { min: 18,   max: 70 };
    if (c <= 14.5) return { min: 30,   max: 99 };
    if (c <= 17)   return { min: 45,   max: 150 };
    if (c <= 20)   return { min: 75,   max: 300 };
    if (c <= 24)   return { min: 150,  max: 600 };
    if (c <= 28)   return { min: 300,  max: 1500 };
    return              { min: 800,  max: 9999 };
  }
  if (op === 'mul') {
    if (c <= 4)    return { aMin: 2, aMax: 5,  bMin: 2, bMax: 4  };
    if (c <= 6)    return { aMin: 2, aMax: 6,  bMin: 2, bMax: 5  };
    if (c <= 8)    return { aMin: 2, aMax: 7,  bMin: 2, bMax: 6  };
    if (c <= 10)   return { aMin: 2, aMax: 8,  bMin: 2, bMax: 7  };
    if (c <= 12)   return { aMin: 2, aMax: 9,  bMin: 2, bMax: 9  };
    if (c <= 14)   return { aMin: 2, aMax: 11, bMin: 2, bMax: 9  };
    if (c <= 16)   return { aMin: 2, aMax: 12, bMin: 2, bMax: 12 };
    if (c <= 19)   return { aMin: 3, aMax: 15, bMin: 2, bMax: 12 };
    if (c <= 22)   return { aMin: 6, aMax: 25, bMin: 2, bMax: 9  };
    if (c <= 26)   return { aMin: 10, aMax: 50, bMin: 2, bMax: 9  };
    return              { aMin: 15, aMax: 99, bMin: 2, bMax: 12 };
  }
  if (op === 'div') {
    if (c <= 5)    return { qMin: 2, qMax: 5,  dMin: 2, dMax: 4  };
    if (c <= 7)    return { qMin: 2, qMax: 6,  dMin: 2, dMax: 5  };
    if (c <= 9)    return { qMin: 2, qMax: 8,  dMin: 2, dMax: 7  };
    if (c <= 11)   return { qMin: 2, qMax: 9,  dMin: 2, dMax: 9  };
    if (c <= 14)   return { qMin: 2, qMax: 11, dMin: 2, dMax: 9  };
    if (c <= 17)   return { qMin: 2, qMax: 12, dMin: 2, dMax: 12 };
    if (c <= 20)   return { qMin: 3, qMax: 15, dMin: 2, dMax: 12 };
    if (c <= 24)   return { qMin: 4, qMax: 25, dMin: 2, dMax: 12 };
    return              { qMin: 5, qMax: 50, dMin: 2, dMax: 12 };
  }
  if (op === 'pow') {
    // Single-digit bases. Exponent rule applied in genProblem:
    //   base < 5 → exp up to 4   (max 4^4 = 256)
    //   base ≥ 5 → exp up to 3   (max 9^3 = 729)
    if (c <= 18) return { baseMin: 2, baseMax: 4 };
    if (c <= 22) return { baseMin: 2, baseMax: 5 };
    if (c <= 27) return { baseMin: 2, baseMax: 7 };
    return            { baseMin: 2, baseMax: 9 };
  }
  return { min: 1, max: 9 };
}

function genProblem(easy, opOverride) {
  if (easy && !opOverride) {
    const a = rand(1,9), b = rand(1,9);
    return { text: `${a} + ${b}`, answer: a + b, op: 'add' };
  }

  // Custom mode has its own generator (player-defined ops + difficulty).
  if (game.mode === 'custom') return genCustomProblem();

  const tier = difficultyTier();
  const allowed = ['add'];
  if (tier >= 2) allowed.push('sub');
  if (tier >= 4) allowed.push('mul');
  if (tier >= 6) allowed.push('div');
  if (tier >= 8) allowed.push('pow');

  let op;
  let isFreshOp = false;
  if (opOverride && opOverride !== 'mixed') {
    // Practice mode: respect player's choice even if outside the natural tier.
    op = opOverride;
  } else if (game.mode === 'practice') {
    op = pick(allowed);
  } else if (game.recentlyUnlockedRemaining > 0 &&
             game.recentlyUnlockedOp &&
             allowed.indexOf(game.recentlyUnlockedOp) !== -1) {
    // Freshness bias: just unlocked an op — force it for several rounds so the
    // tier label and the actual problems agree.
    op = game.recentlyUnlockedOp;
    isFreshOp = true;
    game.recentlyUnlockedRemaining--;
    if (game.recentlyUnlockedRemaining === 0) game.recentlyUnlockedOp = null;
  } else {
    // Weak-spot weighting in versus mode: ops with more recent misses get sampled more
    const weights = allowed.map(o => 1 + (store.stats.weakSpots[o] || 0) * 0.35);
    op = pickWeighted(allowed, weights);
  }

  // Smooth round-based magnitude ramp. Both sides use the same complexity, so
  // they always face similar number ranges (no more "one side gets 4+1 while
  // the other gets 87+92").
  const round = game.totalCorrect + 1;
  let complexity = round / curDiff().tierMult;
  // Newly-unlocked op: ease the player in on small numbers for the forced rounds.
  if (isFreshOp) {
    complexity = Math.min(complexity, 5);
  }
  // 3% chance of a small "variety bump" in early rounds — drops in a slightly
  // harder problem for spice, prevents single-digit monotony. Capped to avoid
  // giant jumps.
  if (complexity <= 6 && Math.random() < 0.03) {
    complexity = Math.min(complexity + 1.5, 7);
  }
  const m = magnitudeFor(op, complexity);

  let a, b, text, answer;
  switch (op) {
    case 'add': {
      a = rand(m.min, m.max); b = rand(m.min, m.max);
      if (tier >= 9 && Math.random() < 0.45) { a = rand(-50, 50); b = rand(-50, 50); }
      text = fmt(a, true) + ' + ' + fmt(b, false);
      answer = a + b;
      break;
    }
    case 'sub': {
      a = rand(m.min, m.max); b = rand(m.min, m.max);
      if (tier < 9) { if (b > a) [a, b] = [b, a]; }
      if (tier >= 9 && Math.random() < 0.4) { a = rand(-50, 50); b = rand(-50, 50); }
      text = fmt(a, true) + ' − ' + fmt(b, false);
      answer = a - b;
      break;
    }
    case 'mul': {
      // FAMILY mode: 35% chance of using a "round" multiplier (5 / 10 / 25 /
      // 50 / 100). These mentally simple but produce larger products
      // (e.g. 25×8=200, 100×7=700) while normal mul stays at single×single.
      const diffKey = DIFF_KEYS[diffIdx];
      if (diffKey === 'FAMILY' && Math.random() < 0.35) {
        a = pick([5, 10, 25, 50, 100]);
        b = rand(2, 9);
        if (Math.random() < 0.5) [a, b] = [b, a];
        text = fmt(a, true) + ' × ' + fmt(b, false);
        answer = a * b;
        break;
      }
      a = rand(m.aMin, m.aMax);
      b = rand(m.bMin, m.bMax);
      if (tier >= 9 && Math.random() < 0.3) a = -a;
      text = fmt(a, true) + ' × ' + fmt(b, false);
      answer = a * b;
      break;
    }
    case 'div': {
      const q = rand(m.qMin, m.qMax);
      const d = rand(m.dMin, m.dMax);
      a = q * d; b = d; answer = q;
      if (tier >= 9 && Math.random() < 0.3) { a = -a; answer = -q; }
      text = fmt(a, true) + ' ÷ ' + fmt(b, false);
      break;
    }
    case 'pow': {
      // Bases stay single-digit. Exponent rule:
      //   base < 5 → exp up to 4 (caps: 2^4=16, 3^4=81, 4^4=256)
      //   base ≥ 5 → exp up to 3 (caps: 5^3=125 ... 9^3=729)
      a = rand(m.baseMin, m.baseMax);
      b = (a < 5) ? pick([2, 2, 3, 3, 4]) : pick([2, 2, 3]);
      answer = Math.pow(a, b);
      text = `${a}^${b}`;
      break;
    }
    case 'alg': {
      // Practice-mode algebra at a moderate difficulty
      return genAlgebra(3);
    }
  }
  return { text, answer, op };
}

// Custom mode: pick from player-selected ops at a fixed number-magnitude difficulty (1-5).
function genCustomProblem() {
  const cfg = game.customSetup;
  const enabled = Object.keys(cfg.ops).filter(o => cfg.ops[o]);
  if (enabled.length === 0) {
    const a = rand(1,9), b = rand(1,9);
    return { text: `${a} + ${b}`, answer: a + b, op: 'add' };
  }
  const op = pick(enabled);
  const diff = clamp(cfg.difficulty || 2, 1, 5);

  if (op === 'alg') return genAlgebra(diff);

  // Number magnitudes per op + difficulty (1=easy, 5=extreme)
  const addSubMax  = [9, 25, 99, 500, 9999][diff - 1];
  const mulMaxA    = [9, 9, 12, 25, 99][diff - 1];
  const mulMaxB    = [9, 9, 12, 12, 12][diff - 1];
  const powBaseMax = [5, 7, 9, 9, 9][diff - 1];

  let a, b, text, answer;
  switch (op) {
    case 'add': {
      a = rand(1, addSubMax); b = rand(1, addSubMax);
      text = fmt(a, true) + ' + ' + fmt(b, false);
      answer = a + b;
      break;
    }
    case 'sub': {
      a = rand(1, addSubMax); b = rand(1, addSubMax);
      if (b > a) [a, b] = [b, a];
      text = fmt(a, true) + ' − ' + fmt(b, false);
      answer = a - b;
      break;
    }
    case 'mul': {
      a = rand(2, mulMaxA);
      b = rand(2, mulMaxB);
      text = fmt(a, true) + ' × ' + fmt(b, false);
      answer = a * b;
      break;
    }
    case 'div': {
      const q = rand(2, mulMaxB);
      const d = rand(2, mulMaxA);
      a = q * d; b = d; answer = q;
      text = fmt(a, true) + ' ÷ ' + fmt(b, false);
      break;
    }
    case 'pow': {
      // Same exp rule as versus mode: base < 5 → exp up to 4, base ≥ 5 → up to 3.
      a = rand(2, powBaseMax);
      b = (a < 5) ? pick([2, 2, 3, 3, 4]) : pick([2, 2, 3]);
      answer = Math.pow(a, b);
      text = `${a}^${b}`;
      break;
    }
  }
  return { text, answer, op };
}

// Linear-equation algebra problems: find x.
// diff 1: a + x = c   diff 2: + sub variant   diff 3: + ax = c   diff 4-5: + ax±b = c
function genAlgebra(diff) {
  diff = clamp(diff, 1, 5);
  const max = [10, 20, 50, 99, 200][diff - 1];
  const types = diff <= 1 ? ['add'] :
                diff <= 2 ? ['add', 'sub'] :
                diff <= 3 ? ['add', 'sub', 'mul'] :
                            ['add', 'sub', 'mul', 'linear'];
  const type = pick(types);
  let text, answer;
  if (type === 'add') {
    const x = rand(1, max);
    const a = rand(1, max);
    text = `${a} + x = ${a + x}      x =`;
    answer = x;
  } else if (type === 'sub') {
    const x = rand(1, max);
    const a = x + rand(1, max);
    text = `${a} − x = ${a - x}      x =`;
    answer = x;
  } else if (type === 'mul') {
    const x = rand(2, Math.min(12, max));
    const a = rand(2, 9);
    text = `${a}x = ${a * x}      x =`;
    answer = x;
  } else { // linear: ax ± b = c
    const x = rand(1, 12);
    const a = rand(2, 5);
    const b = rand(1, 20);
    if (Math.random() < 0.7) {
      text = `${a}x + ${b} = ${a * x + b}      x =`;
    } else {
      text = `${a}x − ${b} = ${a * x - b}      x =`;
    }
    answer = x;
  }
  return { text, answer, op: 'alg', isAlgebra: true, algType: type };
}

// Mouse position for hover detection on title-screen buttons.
let mouseX = -1, mouseY = -1;
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
  mouseY = e.clientY - rect.top;
  // Pointer cursor when hovering a button or the easter egg.
  let overInteractive = false;
  if (game.state === STATES.TITLE) {
    for (const btn of titleButtons) {
      if (mouseX >= btn.x && mouseX <= btn.x + btn.w &&
          mouseY >= btn.y && mouseY <= btn.y + btn.h) { overInteractive = true; break; }
    }
    if (!overInteractive && easterEggHitbox) {
      const eb = easterEggHitbox;
      if (mouseX >= eb.x && mouseX <= eb.x + eb.w &&
          mouseY >= eb.y && mouseY <= eb.y + eb.h) overInteractive = true;
    }
  }
  canvas.style.cursor = overInteractive ? 'pointer' : 'default';
});
canvas.addEventListener('mouseleave', () => { mouseX = -1; mouseY = -1; canvas.style.cursor = 'default'; });

// Title-screen clickable buttons. Refreshed every frame in drawTitle.
let titleButtons = [];
// Multi-choice answer hitboxes during PROBLEM state (4 cells). Refreshed in drawProblem.
let mcChoiceHitboxes = [];
// Title-screen extra hitboxes (chevrons, MC toggle, names line). Refreshed in drawTitle.
let titleExtras = {};
// On-screen number keypad (typing mode on touch). Refreshed in drawProblem.
let keypadHitboxes = [];
// In-game pause button hitbox (top center). Set in drawHUD, cleared otherwise.
let hudPauseHitbox = null;
// Pause overlay tap buttons (Resume / Quit). Set in drawPauseOverlay.
let pauseOverlayButtons = [];
// Practice menu tap buttons (op chevrons, start, back).
let practiceMenuButtons = [];
// Custom setup tap targets (op toggles, difficulty chevrons, start, back).
let customSetupButtons = [];

function hitTest(x, y, box) {
  return box && x >= box.x && x <= box.x + box.w && y >= box.y && y <= box.y + box.h;
}

// Small square chevron button — for cycling MODE / DIFFICULTY. Returns hitbox.
function drawChevButton(cx, cy, size, char) {
  const x = cx - size/2, y = cy - size/2;
  const hovered = hitTest(mouseX, mouseY, { x, y, w: size, h: size });
  ctx.save();
  ctx.fillStyle = hovered ? 'rgba(255,255,255,0.20)' : 'rgba(255,255,255,0.07)';
  ctx.strokeStyle = hovered ? 'rgba(255,255,255,0.7)' : 'rgba(255,255,255,0.30)';
  ctx.lineWidth = 1.6;
  roundRect(x, y, size, size, 9);
  ctx.fill();
  ctx.stroke();
  ctx.font = 'bold ' + Math.round(size * 0.5) + 'px "Trebuchet MS"';
  ctx.fillStyle = hovered ? '#fff' : 'rgba(255,255,255,0.78)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(char, cx, cy);
  ctx.restore();
  return { x, y, w: size, h: size };
}

// Generic button drawer with hover styling. Returns true if hovered.
function drawButton(x, y, w, h, label, accent, sublabel) {
  const hovered = mouseX >= x && mouseX <= x + w && mouseY >= y && mouseY <= y + h;
  ctx.save();
  // Background gradient pill
  const grad = ctx.createLinearGradient(x, y, x, y + h);
  if (hovered) {
    grad.addColorStop(0, 'rgba(255,255,255,0.22)');
    grad.addColorStop(1, 'rgba(255,255,255,0.06)');
  } else {
    grad.addColorStop(0, 'rgba(255,255,255,0.10)');
    grad.addColorStop(1, 'rgba(255,255,255,0.02)');
  }
  ctx.fillStyle = grad;
  ctx.strokeStyle = hovered ? accent : 'rgba(255,255,255,0.4)';
  ctx.lineWidth = hovered ? 2.5 : 1.5;
  ctx.shadowColor = accent;
  ctx.shadowBlur = hovered ? 22 : 0;
  roundRect(x, y, w, h, 14);
  ctx.fill();
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Label
  ctx.font = 'bold 17px "Trebuchet MS"';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = hovered ? accent : '#fff';
  if (sublabel) {
    ctx.fillText(label, x + w/2, y + h/2 - 9);
    ctx.font = '11px "Trebuchet MS"';
    ctx.fillStyle = hovered ? accent : 'rgba(255,255,255,0.6)';
    ctx.fillText(sublabel, x + w/2, y + h/2 + 11);
  } else {
    ctx.fillText(label, x + w/2, y + h/2);
  }
  ctx.restore();
  return hovered;
}

// Click / tap handler — supports full mobile play. Handles every state where
// the user might want to interact via touch.
canvas.addEventListener('click', (e) => {
  ensureAudio();
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  // Help / Records — tap anywhere dismisses
  if (game.state === STATES.HELP || game.state === STATES.RECORDS) {
    game.state = STATES.TITLE;
    sfx.type();
    return;
  }

  // Pong with portrait-rotate prompt — tap "Back to menu" to bail
  if (game.state === STATES.PONG && isPortraitMobile() && game._rotateBackBtn) {
    if (hitTest(x, y, game._rotateBackBtn)) {
      game.pong = null;
      game.state = STATES.TITLE;
      game._rotateBackBtn = null;
      sfx.type();
      return;
    }
  }

  // HUD pause button — tap during PROBLEM / BALL / RESULT / PONG states
  const inPlay = game.state === STATES.PROBLEM || game.state === STATES.BALL ||
                 game.state === STATES.RESULT || game.state === STATES.PONG;
  if (inPlay && hudPauseHitbox && hitTest(x, y, hudPauseHitbox)) {
    togglePause();
    sfx.type();
    return;
  }

  // Easter message — tap anywhere starts standalone Pong
  if (game.state === STATES.EASTER_MESSAGE) {
    startPongStandalone();
    return;
  }

  // Game over — tap anywhere advances. If a 15-streak earned bonus Pong,
  // play that next; otherwise return to title.
  if (game.state === STATES.GAME_OVER) {
    if (game.pongEarned) {
      game.pongEarned = false;
      startPongStandalone();
    } else {
      game.state = STATES.TITLE;
    }
    sfx.type();
    return;
  }

  // Name entry — tap anywhere acts like Enter (advance to next side or start the game)
  if (game.state === STATES.NAME_ENTRY) {
    handleNameEntryKey({ key: 'Enter', preventDefault: () => {} });
    return;
  }

  // Practice menu — tap chevrons / START / BACK
  if (game.state === STATES.PRACTICE_MENU) {
    for (const btn of practiceMenuButtons) {
      if (hitTest(x, y, btn)) {
        if (btn.action === 'opPrev') {
          const i = PRACTICE_OPS.indexOf(game.practiceOp);
          game.practiceOp = PRACTICE_OPS[(i + PRACTICE_OPS.length - 1) % PRACTICE_OPS.length];
        } else if (btn.action === 'opNext') {
          const i = PRACTICE_OPS.indexOf(game.practiceOp);
          game.practiceOp = PRACTICE_OPS[(i + 1) % PRACTICE_OPS.length];
        } else if (btn.action === 'start') {
          startPractice();
        } else if (btn.action === 'back') {
          game.state = STATES.TITLE;
        }
        sfx.type();
        return;
      }
    }
    return;
  }

  // Custom setup — tap op rows, chevrons, START / BACK
  if (game.state === STATES.CUSTOM_SETUP) {
    for (const btn of customSetupButtons) {
      if (hitTest(x, y, btn)) {
        if (btn.action === 'toggleOp') {
          game.customSetup.ops[btn.op] = !game.customSetup.ops[btn.op];
        } else if (btn.action === 'diffPrev') {
          game.customSetup.difficulty = clamp((game.customSetup.difficulty || 2) - 1, 1, 5);
        } else if (btn.action === 'diffNext') {
          game.customSetup.difficulty = clamp((game.customSetup.difficulty || 2) + 1, 1, 5);
        } else if (btn.action === 'start') {
          const enabled = CUSTOM_OPS_ORDER.filter(o => game.customSetup.ops[o]);
          if (enabled.length > 0) {
            persistCustomSetup();
            startCustom();
          } else {
            game.toast = { text: 'PICK AT LEAST ONE OP', t: 1.4, color: '#ff7755' };
          }
        } else if (btn.action === 'back') {
          game.state = STATES.TITLE;
        }
        sfx.type();
        return;
      }
    }
    return;
  }

  // Pause overlay — tap Resume or Quit to Menu
  if (game.paused && pauseOverlayButtons && pauseOverlayButtons.length) {
    for (const btn of pauseOverlayButtons) {
      if (hitTest(x, y, btn)) {
        if (btn.action === 'resume') {
          togglePause();
        } else if (btn.action === 'quit') {
          game.paused = false;
          game.pong = null; // clean up pong state if we were in it
          game.state = STATES.TITLE;
        }
        sfx.type();
        return;
      }
    }
    return; // tap outside the buttons does nothing while paused
  }

  // Problem state — multi-choice OR on-screen keypad (typing mode)
  if (game.state === STATES.PROBLEM && game.current) {
    // Tap on the HUD pause button to pause (also works in BALL/RESULT states
    // via the check below, but PROBLEM is the most common one)
    if (hudPauseHitbox && hitTest(x, y, hudPauseHitbox)) {
      togglePause();
      sfx.type();
      return;
    }
    if (game.paused) return;
    if (game.mode === 'versus1p' && game.current.side === 'right') return; // CPU's turn
    const cur = game.current;
    if (cur.submitted) return;

    if (cur.problem.choices) {
      // Multi-choice: tap a cell to pick it
      for (let i = 0; i < mcChoiceHitboxes.length; i++) {
        if (hitTest(x, y, mcChoiceHitboxes[i])) {
          cur.typed = String(cur.problem.choices[i]);
          sfx.type();
          submitAnswer();
          return;
        }
      }
    } else {
      // Typing mode: tap on the on-screen number keypad
      for (const k of keypadHitboxes) {
        if (hitTest(x, y, k)) {
          if (k.key === 'SUBMIT') {
            sfx.type();
            submitAnswer();
          } else if (k.key === '⌫') {
            cur.typed = cur.typed.slice(0, -1);
            sfx.type();
          } else if (k.key === '−') {
            if (cur.typed.length === 0) { cur.typed = '-'; sfx.type(); }
          } else if (/^[0-9]$/.test(k.key)) {
            if (cur.typed.length < 8) {
              cur.typed += k.key;
              sfx.type();
              checkAutoSubmit();
            }
          }
          return;
        }
      }
    }
    return;
  }

  // Title screen — easter egg → buttons → chevrons → toggle → tap-anywhere-else starts the game
  if (game.state === STATES.TITLE) {
    // Easter egg
    if (hitTest(x, y, easterEggHitbox)) {
      game.state = STATES.EASTER_MESSAGE;
      sfx.type();
      return;
    }
    // Title buttons (HELP, RECORDS, START, FULLSCREEN)
    for (const btn of titleButtons) {
      if (hitTest(x, y, btn)) {
        if (btn.action === 'help')         game.state = STATES.HELP;
        else if (btn.action === 'records') game.state = STATES.RECORDS;
        else if (btn.action === 'fullscreen') toggleFullscreen();
        else if (btn.action === 'start') {
          // Auto-request fullscreen on touch devices when starting a game,
          // so the browser URL bar tucks away. Silently no-ops if denied.
          if (isTouchDevice && !isFullscreen()) requestFullscreenSilent();
          startGameFlow();
        }
        sfx.type();
        return;
      }
    }
    // Mode chevrons (▲ / ▼)
    if (hitTest(x, y, titleExtras.modeUp) || hitTest(x, y, titleExtras.modeDown)) {
      const modes = ['versus2p', 'versus1p', 'practice', 'custom'];
      const i = modes.indexOf(game.mode);
      const dir = hitTest(x, y, titleExtras.modeDown) ? 1 : modes.length - 1;
      game.mode = modes[(i + dir) % modes.length];
      updatePaddleNames();
      sfx.type();
      return;
    }
    // Difficulty chevrons (◀ / ▶)
    if (hitTest(x, y, titleExtras.diffLeft) || hitTest(x, y, titleExtras.diffRight)) {
      const dir = hitTest(x, y, titleExtras.diffRight) ? 1 : DIFF_KEYS.length - 1;
      diffIdx = (diffIdx + dir) % DIFF_KEYS.length;
      sfx.type();
      return;
    }
    // Multi-choice toggle line
    if (hitTest(x, y, titleExtras.mcToggle)) {
      game.multiChoice = !game.multiChoice;
      store.multiChoice = game.multiChoice;
      saveStore();
      sfx.type();
      return;
    }
    // Names line — tap to rename players
    if (hitTest(x, y, titleExtras.namesArea)) {
      game.state = STATES.NAME_ENTRY;
      game.nameEntry = { side: 'left', text: store.names.left };
      sfx.type();
      return;
    }
    // Anywhere else — DOES NOTHING. The big START GAME button is the only
    // path to begin (besides keyboard SPACE/Enter). Prevents accidental taps
    // from launching a game mid-configuration.
    return;
  }
});

// keyup listener — needed for held-key paddle movement during PONG state
window.addEventListener('keyup', (e) => {
  if (game.state !== STATES.PONG || !game.pong) return;
  const k = game.pong.keys;
  if (e.key === 'w' || e.key === 'W') k.w = false;
  if (e.key === 's' || e.key === 'S') k.s = false;
  if (e.key === 'ArrowUp') k.up = false;
  if (e.key === 'ArrowDown') k.down = false;
});

// Touch handlers for pong on phone/tablet — left half controls left paddle,
// right half controls right paddle. Multi-touch supported (one finger per side).
canvas.addEventListener('touchstart', (e) => {
  if (game.state !== STATES.PONG || !game.pong) return;
  e.preventDefault();
  const p = game.pong;
  for (const t of e.changedTouches) {
    const x = t.clientX, y = t.clientY;
    if (x < W/2 && p.touches.left === null) {
      p.touches.left = { id: t.identifier, y };
    } else if (x >= W/2 && p.touches.right === null) {
      p.touches.right = { id: t.identifier, y };
    }
  }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  if (game.state !== STATES.PONG || !game.pong) return;
  e.preventDefault();
  const p = game.pong;
  for (const t of e.changedTouches) {
    if (p.touches.left && t.identifier === p.touches.left.id) p.touches.left.y = t.clientY;
    if (p.touches.right && t.identifier === p.touches.right.id) p.touches.right.y = t.clientY;
  }
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  if (game.state !== STATES.PONG || !game.pong) return;
  const p = game.pong;
  for (const t of e.changedTouches) {
    if (p.touches.left && t.identifier === p.touches.left.id) p.touches.left = null;
    if (p.touches.right && t.identifier === p.touches.right.id) p.touches.right = null;
  }
});
canvas.addEventListener('touchcancel', (e) => {
  if (game.state !== STATES.PONG || !game.pong) return;
  game.pong.touches.left = null;
  game.pong.touches.right = null;
});

window.addEventListener('keydown', (e) => {
  ensureAudio();
  if (e.key === 'F11') return;

  // Mute toggle (works any state)
  if (e.key === 'm' || e.key === 'M') {
    store.muted = !store.muted;
    saveStore();
    e.preventDefault();
    return;
  }

  // Pause toggle (only during PROBLEM)
  if ((e.key === 'p' || e.key === 'P') && game.state === STATES.PROBLEM) {
    togglePause();
    e.preventDefault();
    return;
  }

  // While paused: Q (or Escape) bails out to the main menu so player can change
  // mode, names, difficulty, etc.
  if (game.paused && (e.key === 'q' || e.key === 'Q' || e.key === 'Escape')) {
    game.paused = false;
    game.pong = null; // clean up pong if we were paused mid-pong
    game.state = STATES.TITLE;
    e.preventDefault();
    return;
  }

  // Escape during practice/custom gameplay → bail to title
  if (e.key === 'Escape' &&
      (game.mode === 'practice' || game.mode === 'custom') &&
      (game.state === STATES.PROBLEM || game.state === STATES.RESULT || game.state === STATES.BALL)) {
    game.state = STATES.TITLE;
    game.paused = false;
    e.preventDefault();
    return;
  }

  // === TITLE ===
  if (game.state === STATES.TITLE) {
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      startGameFlow();
    } else if (e.key === 'ArrowLeft') {
      diffIdx = (diffIdx + DIFF_KEYS.length - 1) % DIFF_KEYS.length;
      sfx.type();
      e.preventDefault();
    } else if (e.key === 'ArrowRight') {
      diffIdx = (diffIdx + 1) % DIFF_KEYS.length;
      sfx.type();
      e.preventDefault();
    } else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      const modes = ['versus2p', 'versus1p', 'practice', 'custom'];
      const i = modes.indexOf(game.mode);
      const next = (i + (e.key === 'ArrowDown' ? 1 : modes.length - 1)) % modes.length;
      game.mode = modes[next];
      updatePaddleNames();
      sfx.type();
      e.preventDefault();
    } else if (e.key === 'n' || e.key === 'N') {
      game.state = STATES.NAME_ENTRY;
      game.nameEntry = { side: 'left', text: store.names.left };
      e.preventDefault();
    } else if (e.key === 'c' || e.key === 'C') {
      // Toggle multiple-choice input mode (composes with any game mode)
      game.multiChoice = !game.multiChoice;
      store.multiChoice = game.multiChoice;
      saveStore();
      sfx.type();
      e.preventDefault();
    } else if (e.key === 'e' || e.key === 'E') {
      // Easter egg — show the love note then route to standalone Pong.
      game.state = STATES.EASTER_MESSAGE;
      sfx.type();
      e.preventDefault();
    }
    return;
  }

  // === EASTER MESSAGE ===
  if (game.state === STATES.EASTER_MESSAGE) {
    if (e.key === ' ' || e.key === 'Enter') {
      startPongStandalone();
      e.preventDefault();
    } else if (e.key === 'Escape') {
      game.state = STATES.TITLE;
      e.preventDefault();
    }
    return;
  }

  // === HELP / RECORDS — any key (or click anywhere) returns to title ===
  if (game.state === STATES.HELP || game.state === STATES.RECORDS) {
    if (e.key === 'Escape' || e.key === ' ' || e.key === 'Enter' ||
        e.key === 'Backspace' || e.key === 'h' || e.key === 'H' ||
        e.key === 'r' || e.key === 'R') {
      game.state = STATES.TITLE;
      e.preventDefault();
    }
    return;
  }

  // === PONG INTERLUDE ===
  if (game.state === STATES.PONG) {
    if (!game.pong) return;
    const k = game.pong.keys;
    if (e.key === 'w' || e.key === 'W') { k.w = true; e.preventDefault(); return; }
    if (e.key === 's' || e.key === 'S') { k.s = true; e.preventDefault(); return; }
    if (e.key === 'ArrowUp')             { k.up = true; e.preventDefault(); return; }
    if (e.key === 'ArrowDown')           { k.down = true; e.preventDefault(); return; }
    if (e.key === 'Escape') {
      // Bail out of the whole match
      game.pong = null;
      game.state = STATES.TITLE;
      e.preventDefault();
      return;
    }
    return;
  }

  // === GAME OVER ===
  if (game.state === STATES.GAME_OVER) {
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      if (game.pongEarned) {
        game.pongEarned = false;
        startPongStandalone();
      } else {
        game.state = STATES.TITLE;
      }
    } else if (e.key === 'Escape') {
      // Always bail to title on ESC, even if pong was earned.
      e.preventDefault();
      game.pongEarned = false;
      game.state = STATES.TITLE;
    }
    return;
  }

  // === NAME ENTRY ===
  if (game.state === STATES.NAME_ENTRY) {
    handleNameEntryKey(e);
    return;
  }

  // === PRACTICE MENU ===
  if (game.state === STATES.PRACTICE_MENU) {
    handlePracticeMenuKey(e);
    return;
  }

  // === CUSTOM SETUP ===
  if (game.state === STATES.CUSTOM_SETUP) {
    handleCustomSetupKey(e);
    return;
  }

  // === PROBLEM (player typing) ===
  if (game.state !== STATES.PROBLEM) return;
  if (game.paused) return;
  const cur = game.current;
  if (!cur || cur.submitted) return;

  // 1P mode: keys ignored on CPU's turn (right side)
  if (game.mode === 'versus1p' && cur.side === 'right') return;

  // Multi-choice mode: 1-4 picks one of the four choices, no other keys.
  if (cur.problem.choices) {
    if (/^[1-4]$/.test(e.key)) {
      const idx = parseInt(e.key, 10) - 1;
      if (idx < cur.problem.choices.length) {
        cur.typed = String(cur.problem.choices[idx]);
        sfx.type();
        submitAnswer();
      }
      e.preventDefault();
    }
    return;
  }

  if (/^[0-9]$/.test(e.key)) {
    if (cur.typed.length < 8) { cur.typed += e.key; sfx.type(); checkAutoSubmit(); }
    e.preventDefault();
  } else if (e.key === '-' || e.key === '_') {
    if (cur.typed.length === 0) { cur.typed = '-'; sfx.type(); }
    e.preventDefault();
  } else if (e.key === 'Backspace') {
    cur.typed = cur.typed.slice(0, -1);
    e.preventDefault();
  } else if (e.key === 'Enter') {
    submitAnswer();
    e.preventDefault();
  }
});

function handleNameEntryKey(e) {
  const ne = game.nameEntry;
  if (e.key === 'Enter') {
    const trimmed = ne.text.trim().slice(0, 12).toUpperCase();
    const fallback = ne.side === 'left' ? 'PLAYER 1' : 'PLAYER 2';
    store.names[ne.side] = trimmed || fallback;
    if (ne.side === 'left') {
      ne.side = 'right';
      // Suggested-flow: prefill MIMI on right if it's still default; otherwise use existing.
      if (ne.suggested && store.names.right === 'PLAYER 2') {
        ne.text = 'MIMI';
      } else {
        ne.text = store.names.right;
      }
    } else {
      saveStore();
      updatePaddleNames();
      // Either start the game (when name entry was forced before a 2P match)
      // or return to title (when the user chose to rename via N).
      if (ne.thenAction === 'startGame') {
        startGame();
      } else {
        game.state = STATES.TITLE;
      }
    }
    sfx.type();
    e.preventDefault();
  } else if (e.key === 'Escape') {
    game.state = STATES.TITLE;
    e.preventDefault();
  } else if (e.key === 'Backspace') {
    ne.text = ne.text.slice(0, -1);
    e.preventDefault();
  } else if (e.key === ' ' && ne.text.length < 12) {
    ne.text += ' ';
    e.preventDefault();
  } else if (e.key.length === 1 && ne.text.length < 12 && /^[a-zA-Z0-9_-]$/.test(e.key)) {
    ne.text += e.key.toUpperCase();
    sfx.type();
    e.preventDefault();
  }
}

function handlePracticeMenuKey(e) {
  if (e.key === 'ArrowLeft') {
    const i = PRACTICE_OPS.indexOf(game.practiceOp);
    game.practiceOp = PRACTICE_OPS[(i + PRACTICE_OPS.length - 1) % PRACTICE_OPS.length];
    sfx.type(); e.preventDefault();
  } else if (e.key === 'ArrowRight') {
    const i = PRACTICE_OPS.indexOf(game.practiceOp);
    game.practiceOp = PRACTICE_OPS[(i + 1) % PRACTICE_OPS.length];
    sfx.type(); e.preventDefault();
  } else if (e.key === ' ' || e.key === 'Enter') {
    startPractice();
    e.preventDefault();
  } else if (e.key === 'Escape') {
    game.state = STATES.TITLE;
    e.preventDefault();
  }
}

function handleCustomSetupKey(e) {
  const cs = game.customSetup;
  if (e.key === 'Escape') {
    game.state = STATES.TITLE;
    e.preventDefault();
    return;
  }
  if (e.key === ' ' || e.key === 'Enter') {
    // Need at least one op selected
    const enabled = CUSTOM_OPS_ORDER.filter(o => cs.ops[o]);
    if (enabled.length > 0) {
      persistCustomSetup();
      startCustom();
    } else {
      game.toast = { text: 'PICK AT LEAST ONE OP', t: 1.4, color: '#ff7755' };
    }
    e.preventDefault();
    return;
  }
  // Number keys 1-6 toggle ops
  if (/^[1-6]$/.test(e.key)) {
    const idx = parseInt(e.key, 10) - 1;
    const op = CUSTOM_OPS_ORDER[idx];
    cs.ops[op] = !cs.ops[op];
    sfx.type();
    e.preventDefault();
    return;
  }
  // ◀ ▶ adjusts difficulty 1-5
  if (e.key === 'ArrowLeft') {
    cs.difficulty = clamp((cs.difficulty || 2) - 1, 1, 5);
    sfx.type(); e.preventDefault();
  } else if (e.key === 'ArrowRight') {
    cs.difficulty = clamp((cs.difficulty || 2) + 1, 1, 5);
    sfx.type(); e.preventDefault();
  }
}

function togglePause() {
  // Pause is allowed during any active gameplay state (PROBLEM, BALL, RESULT, PONG).
  const inPlay = game.state === STATES.PROBLEM || game.state === STATES.BALL ||
                 game.state === STATES.RESULT || game.state === STATES.PONG;
  if (!inPlay) return;
  if (game.paused) {
    const dur = performance.now() - game.pauseStart;
    if (game.current) game.current.startTime += dur;
    game.paused = false;
  } else {
    game.paused = true;
    game.pauseStart = performance.now();
  }
}

// First user gesture unlocks audio on some browsers.
window.addEventListener('pointerdown', ensureAudio, { once: false });

function checkAutoSubmit() {
  const cur = game.current;
  if (!cur) return;
  const expected = String(cur.problem.answer);
  if (cur.typed === expected) submitAnswer();
}

function submitAnswer() {
  const cur = game.current;
  if (!cur || cur.submitted) return;
  cur.submitted = true;
  const userAnswer = parseInt(cur.typed, 10);
  const correct = !isNaN(userAnswer) && userAnswer === cur.problem.answer;
  const used = (performance.now() - cur.startTime) / 1000;
  cur.timeUsed = clamp(used, 0.3, cur.timeLimit);
  if (correct) onCorrect();
  else onWrong(false, isNaN(userAnswer) ? null : userAnswer);
}

function onCorrect() {
  const cur = game.current;
  game.totalCorrect++;
  store.stats.totalSolved = (store.stats.totalSolved || 0) + 1;

  // Modest weak-spot decay on correct answer (so it self-heals)
  if (store.stats.weakSpots[cur.problem.op]) {
    store.stats.weakSpots[cur.problem.op] = Math.max(0, store.stats.weakSpots[cur.problem.op] - 0.5);
  }

  const tier = difficultyTier();
  if (tier !== game.prevTier) {
    game.prevTier = tier;
    // Custom mode: difficulty is player-controlled, suppress level chatter.
    if (game.mode !== 'custom') {
      const newOp = tierIntroducesOp(tier);
      if (newOp && game.mode !== 'practice') {
        // A fresh op just unlocked. Lock the next several rounds to it so the
        // player actually gets to drill what they earned.
        game.recentlyUnlockedOp = newOp;
        game.recentlyUnlockedRemaining = 5;
        game.toast = { text: opUnlockText(newOp), t: 2.4, color: '#7fff90' };
      } else {
        game.toast = { text: 'LEVEL ' + tier + '   ' + tierName(tier), t: 1.8, color: '#ffe066' };
      }
      sfx.level();
    }
  }
  const side = cur.side;
  game.streak[side]++;
  game.matchBestStreak = Math.max(game.matchBestStreak, game.streak[side]);
  store.stats.bestStreak = Math.max(store.stats.bestStreak || 0, game.streak[side]);
  saveStore();

  // Bonus Pong unlock: when the match accumulates 15 correct answers across
  // both players, queue a Pong round to play AFTER the match ends. Doesn't
  // interrupt the math game.
  const isVersus = game.mode === 'versus2p' || game.mode === 'versus1p';
  if (isVersus && !game.pongEarned && game.totalCorrect >= PONG.TOTAL_TRIGGER) {
    game.pongEarned = true;
    game.toast = { text: 'PONG BONUS UNLOCKED!  (' + game.totalCorrect + ' correct so far)', t: 2.4, color: '#7fff90' };
    if (!store.muted) sfx.spectacle();
  }

  game.lastTimeUsed = cur.timeUsed;
  game.lastTimeLimit = cur.timeLimit;
  sfx.correct();

  const paddle = side === 'left' ? game.paddleL : game.paddleR;
  paddle.pulse = 1;
  paddle.y = clamp(game.ball.y - paddle.h/2, 8, H - paddle.h - 8);
  const hitX = side === 'left' ? paddle.x + paddle.w : paddle.x;
  spawnHitParticles(hitX, paddle.y + paddle.h/2, side === 'left' ? '#56e2ff' : '#ff7ad8');
  game.flash = { color: side === 'left' ? '#56e2ff' : '#ff7ad8', a: 0.35 };
  game.shake = { mag: 8, t: 0.25 };

  if (game.streak[side] >= 5 && game.streak[side] % 5 === 0) triggerSpectacle(side);

  // Practice mode: no opponent, brief pause then next problem
  if (game.mode === 'practice') {
    game.ball.travel = null;
    game.state = STATES.RESULT;
    game.stateTimer = 0.5;
    return;
  }

  const fromX = side === 'left' ? paddle.x + paddle.w + game.ball.r : paddle.x - game.ball.r;
  const oppPaddle = side === 'left' ? game.paddleR : game.paddleL;
  const toX   = side === 'left' ? oppPaddle.x - game.ball.r : oppPaddle.x + oppPaddle.w + game.ball.r;
  const ballDur = clamp(cur.timeUsed * 0.55 + 0.4, 0.55, 2.2);
  game.ball.travel = {
    fromX, fromY: paddle.y + paddle.h/2,
    toX, toY: H/2 + randF(-H*0.18, H*0.18),
    duration: ballDur,
    elapsed: 0,
  };
  game.ball.x = fromX;
  game.ball.y = paddle.y + paddle.h/2;
  game.ball.color = side === 'left' ? '#9ee9ff' : '#ffb0e8';
  game.state = STATES.BALL;
}

function onWrong(timedOut, userAnswer) {
  const cur = game.current;
  const side = cur.side;
  const opponent = side === 'left' ? 'right' : 'left';

  // Track weak spot (per operation type)
  store.stats.weakSpots[cur.problem.op] = (store.stats.weakSpots[cur.problem.op] || 0) + 1;
  saveStore();

  // Build the teaching toast: prefix + the equation with the correct answer.
  const ans = cur.problem.answer;
  const eqLine = `${cur.problem.text} = ${ans}`;
  let prefix;
  if (timedOut) {
    prefix = 'TIME!';
  } else if (userAnswer != null) {
    const diff = Math.abs(userAnswer - ans);
    if (diff === 1) prefix = 'OFF BY 1!';
    else if (diff === 10) prefix = 'OFF BY 10!';
    else if (diff === 100) prefix = 'OFF BY 100!';
    else if (userAnswer === -ans) prefix = 'WRONG SIGN!';
    else prefix = 'OOPS!';
  } else {
    prefix = 'OOPS!';
  }

  game.streak[side] = 0;
  game.lastTimeUsed = null;
  game.lastTimeLimit = null;
  if (side === 'left') game.paddleL.vibe = 1; else game.paddleR.vibe = 1;
  sfx.wrong();
  game.flash = { color: '#ff3344', a: 0.55 };
  game.shake = { mag: 22, t: 0.55 };
  game.toast = { text: prefix + '   ' + eqLine, t: 2.6, color: '#ff7755' };

  // Practice mode: no scoring, just continue after a beat
  if (game.mode === 'practice') {
    game.ball.travel = null;
    game.state = STATES.RESULT;
    game.stateTimer = 2.2;
    return;
  }

  // Versus: opponent scores
  game.score[opponent]++;

  const paddle = side === 'left' ? game.paddleL : game.paddleR;
  const fromX = W * 0.5;
  const toX = side === 'left' ? -80 : W + 80;
  game.ball.travel = {
    fromX, fromY: paddle.y + paddle.h/2,
    toX, toY: paddle.y + paddle.h/2 + randF(-40, 40),
    duration: 0.8, elapsed: 0,
  };
  game.ball.x = fromX;
  game.ball.y = paddle.y + paddle.h/2;
  game.ball.color = '#ff5577';
  game.state = STATES.RESULT;
  game.stateTimer = 2.4; // longer than before so the equation toast lands

  if (game.score.left >= WIN_SCORE || game.score.right >= WIN_SCORE) {
    game.winnerSide = game.score.left >= WIN_SCORE ? 'left' : 'right';
    store.stats.gamesPlayed = (store.stats.gamesPlayed || 0) + 1;
    // H2H: record this match's winner→loser pair (skipped if either is a default name).
    const winnerName = game.winnerSide === 'left' ? game.paddleL.name : game.paddleR.name;
    const loserName  = game.winnerSide === 'left' ? game.paddleR.name : game.paddleL.name;
    recordResult(winnerName, loserName);
    saveStore();
  }
}

function startGame() {
  game.score = { left: 0, right: 0 };
  game.streak = { left: 0, right: 0 };
  game.totalCorrect = 0;
  game.matchBestStreak = 0;
  game.prevTier = 1;
  game.lastTimeUsed = null;
  game.lastTimeLimit = null;
  game.winnerSide = null;
  game.recentlyUnlockedOp = null;
  game.recentlyUnlockedRemaining = 0;
  game.pongEarned = false;
  game.pong = null;
  game.matchStartTime = performance.now();
  // recentProblems is intentionally NOT reset — it's a rolling, persistent
  // buffer (see store.recentProblems) so variety holds across matches and
  // sessions, not just within a single match.
  game.toast = { text: 'LEVEL 1   +', t: 1.4, color: '#ffe066' };
  updatePaddleNames();
  startRound(Math.random() < 0.5 ? 'left' : 'right');
}

function startPractice() {
  game.score = { left: 0, right: 0 };
  game.streak = { left: 0, right: 0 };
  game.totalCorrect = 0;
  game.matchBestStreak = 0;
  game.prevTier = 1;
  game.lastTimeUsed = null;
  game.lastTimeLimit = null;
  game.winnerSide = null;
  game.recentlyUnlockedOp = null;
  game.recentlyUnlockedRemaining = 0;
  game.pongEarned = false;
  game.pong = null;
  // recentProblems is intentionally NOT reset — it's a rolling, persistent
  // buffer (see store.recentProblems) so variety holds across matches and
  // sessions, not just within a single match.
  game.toast = { text: 'PRACTICE: ' + PRACTICE_OP_LABELS[game.practiceOp], t: 2.0, color: '#ffe066' };
  updatePaddleNames();
  startRound('left'); // human always serves in practice
}

function startCustom() {
  game.score = { left: 0, right: 0 };
  game.streak = { left: 0, right: 0 };
  game.totalCorrect = 0;
  game.matchBestStreak = 0;
  game.prevTier = 1;
  game.lastTimeUsed = null;
  game.lastTimeLimit = null;
  game.winnerSide = null;
  game.recentlyUnlockedOp = null;
  game.recentlyUnlockedRemaining = 0;
  game.pongEarned = false;
  game.pong = null;
  // recentProblems is intentionally NOT reset — it's a rolling, persistent
  // buffer (see store.recentProblems) so variety holds across matches and
  // sessions, not just within a single match.
  const enabled = CUSTOM_OPS_ORDER.filter(o => game.customSetup.ops[o]);
  const opSummary = enabled.map(o => ({add:'+',sub:'−',mul:'×',div:'÷',pow:'^',alg:'x'})[o]).join(' ');
  game.toast = { text: 'CUSTOM   ' + opSummary + '   D' + game.customSetup.difficulty, t: 2.0, color: '#7fff90' };
  updatePaddleNames();
  startRound('left');
}

function startRound(side) {
  const paddle = side === 'left' ? game.paddleL : game.paddleR;
  game.ball.x = paddle.x + (side === 'left' ? paddle.w + game.ball.r : -game.ball.r);
  game.ball.y = paddle.y + paddle.h/2;

  // Generate a problem, retrying up to 10 times to avoid repeating any of the
  // last 50 problems (rolling, persistent across sessions). At small ranges
  // (e.g. 1-9 add) this is what prevents seeing "5+7" repeatedly across plays.
  const opOverride = game.mode === 'practice' ? game.practiceOp : null;
  let problem;
  for (let attempt = 0; attempt < 10; attempt++) {
    problem = genProblem(false, opOverride);
    if (game.recentProblems.indexOf(problem.text) === -1) break;
  }
  game.recentProblems.push(problem.text);
  if (game.recentProblems.length > 50) game.recentProblems.shift();
  // Persist so variety holds across browser sessions.
  store.recentProblems = game.recentProblems;
  saveStore();

  // If multi-choice mode is on, attach 4 choices to the problem.
  if (game.multiChoice) attachChoices(problem);
  let timeLimit;
  if (game.lastTimeUsed != null && game.lastTimeLimit != null) {
    timeLimit = nextTimeLimit(game.lastTimeUsed, game.lastTimeLimit, problem);
  } else {
    // First problem of a match: start at the mode's max plus any thinking bonus.
    timeLimit = curDiff().maxTime + thinkingBonus(problem);
  }

  game.current = {
    side,
    problem,
    typed: '',
    timeLimit,
    timeRemaining: 0,
    startTime: performance.now(),
    submitted: false,
    timeUsed: 0,
  };
  game.state = STATES.PROBLEM;

  // CPU thinking setup if it's the bot's turn
  if (game.mode === 'versus1p' && side === 'right') {
    setupCPU(timeLimit);
  } else {
    game.cpu.thinking = false;
  }
}

function setupCPU(timeLimit) {
  const cfg = curDiff().cpu;
  // Soft bell-ish wobble: average of two uniforms in [-1,1]
  const wobble = (Math.random() + Math.random() - 1) * cfg.thinkStd;
  const target = clamp(cfg.thinkAvg + wobble, 0.5, timeLimit - 0.25);
  const willMiss = Math.random() > cfg.accuracy;
  const missAmount = willMiss ? pick([1, -1, 10, -10]) : 0;
  game.cpu = { thinking: true, target, elapsed: 0, willMiss, missAmount };
}

// Build 4 multiple-choice options around a problem's correct answer.
// Distractors are plausible-but-wrong (off-by-1, off-by-10, adjacent products,
// sign flip, etc.) so the right answer doesn't stand out.
function attachChoices(problem) {
  const correct = problem.answer;
  const op = problem.op;
  const candidates = new Set();

  if (op === 'mul' || op === 'div') {
    candidates.add(correct + 1);
    candidates.add(correct - 1);
    if (Math.abs(correct) >= 10) {
      const step = Math.max(2, Math.round(Math.abs(correct) * 0.12));
      candidates.add(correct + step);
      candidates.add(correct - step);
    }
    candidates.add(correct + 5);
    candidates.add(correct - 5);
  } else if (op === 'add' || op === 'sub') {
    candidates.add(correct + 1);
    candidates.add(correct - 1);
    candidates.add(correct + 10);
    candidates.add(correct - 10);
    if (Math.abs(correct) > 100) {
      candidates.add(correct + 100);
      candidates.add(correct - 100);
    }
    candidates.add(correct + Math.max(2, Math.floor(Math.abs(correct) * 0.1)));
  } else if (op === 'pow') {
    candidates.add(correct + 1);
    candidates.add(correct - 1);
    candidates.add(Math.max(1, Math.round(correct * 0.6)));
    candidates.add(Math.round(correct * 1.4));
    candidates.add(correct * 2);
  } else if (op === 'alg') {
    candidates.add(correct + 1);
    candidates.add(correct - 1);
    candidates.add(correct + 2);
    candidates.add(correct - 2);
    candidates.add(-correct);
    candidates.add(correct * 2);
  } else {
    candidates.add(correct + 1);
    candidates.add(correct - 1);
    candidates.add(correct + 10);
    candidates.add(correct - 10);
  }

  candidates.delete(correct);
  let arr = [...candidates].filter(d => Number.isFinite(d) && d !== correct);

  // Shuffle
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  let picks = arr.slice(0, 3);

  // Fallback: fill any remaining slots with random small offsets
  while (picks.length < 3) {
    const offset = (Math.random() < 0.5 ? 1 : -1) * (Math.floor(Math.random() * 9) + 1);
    const c = correct + offset;
    if (c !== correct && picks.indexOf(c) === -1) picks.push(c);
  }

  // Combine with correct, shuffle final positions
  const all = [correct, ...picks];
  for (let i = all.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [all[i], all[j]] = [all[j], all[i]];
  }

  problem.choices = all;
  problem.correctIndex = all.indexOf(correct);
  return problem;
}

function pickWrongChoiceIndex(problem) {
  const wrongIdxs = [];
  for (let i = 0; i < problem.choices.length; i++) {
    if (i !== problem.correctIndex) wrongIdxs.push(i);
  }
  return pick(wrongIdxs);
}

// === PONG INTERLUDE ===========================================================

function startPongInterlude(opts) {
  opts = opts || {};
  game.pong = {
    scoreL: 0,
    scoreR: 0,
    paddleL: { y: H/2 - PONG.PADDLE_H/2, targetY: H/2 - PONG.PADDLE_H/2 },
    paddleR: { y: H/2 - PONG.PADDLE_H/2, targetY: H/2 - PONG.PADDLE_H/2 },
    ball: { x: W/2, y: H/2, dx: 0, dy: 0 },
    serveCountdown: PONG.SERVE_COUNTDOWN,
    winnerSide: null,
    endCountdown: null,
    nextMathSide: opts.nextMathSide || null,          // null for standalone
    standalone: !!opts.standalone,
    winScore: opts.winScore || PONG.WIN_SCORE,
    keys: { w: false, s: false, up: false, down: false },
    touches: { left: null, right: null },
    intro: 1.6,
  };
  pongStartServe(Math.random() < 0.5 ? 'left' : 'right');
  game.state = STATES.PONG;
  game.toast = {
    text: opts.standalone ? 'PURE PONG' : 'PONG TIME!',
    t: 1.4,
    color: '#7fff90'
  };
  if (!store.muted) sfx.level();
}

function startPongStandalone() {
  // Longer game when it's the whole thing, not an interlude.
  startPongInterlude({ standalone: true, winScore: 7 });
}

function pongStartServe(servingSide) {
  const p = game.pong;
  p.ball.x = W/2;
  p.ball.y = H/2 + randF(-60, 60);
  // Ball goes toward the OPPONENT of the server (server hit it across).
  const dirX = servingSide === 'left' ? 1 : -1;
  const angle = randF(-0.35, 0.35);
  const speed = PONG.BALL_INIT_SPEED;
  p.ball.dx = dirX * speed * Math.cos(angle);
  p.ball.dy = speed * Math.sin(angle);
  p.serveCountdown = PONG.SERVE_COUNTDOWN;
}

function pongPaddleHit(side, ballY, paddleY) {
  // offset is -1 (top of paddle) to +1 (bottom). Adds vertical angle.
  const offset = (ballY - (paddleY + PONG.PADDLE_H/2)) / (PONG.PADDLE_H/2);
  const p = game.pong;
  // Reflect dx and accelerate
  p.ball.dx = (side === 'left' ? 1 : -1) * Math.abs(p.ball.dx) * PONG.BALL_ACCEL;
  // Add vertical influence from where on paddle hit
  p.ball.dy += offset * 280;
  // Cap total speed
  const sp = Math.hypot(p.ball.dx, p.ball.dy);
  if (sp > PONG.BALL_MAX_SPEED) {
    const k = PONG.BALL_MAX_SPEED / sp;
    p.ball.dx *= k;
    p.ball.dy *= k;
  }
  sfx.hit();
}

function pongFinish(winnerSide) {
  const p = game.pong;
  p.winnerSide = winnerSide;
  p.endCountdown = PONG.END_HOLD;
  p.ball.dx = 0; p.ball.dy = 0;
  const winnerName = winnerSide === 'left' ? game.paddleL.name : game.paddleR.name;
  game.toast = {
    text: winnerName + ' WINS THE INTERLUDE!',
    t: 2.5,
    color: winnerSide === 'left' ? '#56e2ff' : '#ff7ad8'
  };
  game.flash = { color: '#fff', a: 0.6 };
  game.shake = { mag: 18, t: 0.5 };
  if (!store.muted) sfx.score();
}

function updatePong(dt) {
  const p = game.pong;
  if (!p) return;
  // Pong needs landscape on mobile — freeze physics until rotated.
  if (isPortraitMobile()) return;
  // Intro grace period: paddles move but ball waits
  if (p.intro > 0) p.intro -= dt;

  // === Paddle target from input ===
  // Left paddle: W up, S down, or touch on left half
  if (p.touches.left) {
    p.paddleL.targetY = clamp(p.touches.left.y - PONG.PADDLE_H/2, 4, H - PONG.PADDLE_H - 4);
  } else {
    let m = 0;
    if (p.keys.w) m -= 1;
    if (p.keys.s) m += 1;
    p.paddleL.targetY = clamp(p.paddleL.targetY + m * PONG.PADDLE_SPEED * dt, 4, H - PONG.PADDLE_H - 4);
  }
  if (p.touches.right) {
    p.paddleR.targetY = clamp(p.touches.right.y - PONG.PADDLE_H/2, 4, H - PONG.PADDLE_H - 4);
  } else {
    let m = 0;
    if (p.keys.up) m -= 1;
    if (p.keys.down) m += 1;
    p.paddleR.targetY = clamp(p.paddleR.targetY + m * PONG.PADDLE_SPEED * dt, 4, H - PONG.PADDLE_H - 4);
  }
  // Smooth paddle motion (snappy but not instant)
  p.paddleL.y = lerp(p.paddleL.y, p.paddleL.targetY, 1 - Math.exp(-22 * dt));
  p.paddleR.y = lerp(p.paddleR.y, p.paddleR.targetY, 1 - Math.exp(-22 * dt));

  // === End-of-match wait ===
  if (p.endCountdown !== null) {
    p.endCountdown -= dt;
    if (p.endCountdown <= 0) {
      if (p.standalone) {
        // Standalone Pong (easter egg) — return to title screen, no math match.
        game.pong = null;
        game.state = STATES.TITLE;
      } else {
        // Interlude — math match resumes from where we left off.
        const nextSide = p.nextMathSide;
        game.pong = null;
        startRound(nextSide);
      }
    }
    return;
  }

  // === Serve countdown — ball doesn't move yet ===
  if (p.serveCountdown > 0 || p.intro > 0) {
    p.serveCountdown -= dt;
    return;
  }

  // === Ball physics ===
  p.ball.x += p.ball.dx * dt;
  p.ball.y += p.ball.dy * dt;

  // Top/bottom wall bounces
  if (p.ball.y - PONG.BALL_R < 0) {
    p.ball.y = PONG.BALL_R;
    p.ball.dy = Math.abs(p.ball.dy);
    if (!store.muted) beep(440, 0.04, 'square', 0.10);
  } else if (p.ball.y + PONG.BALL_R > H) {
    p.ball.y = H - PONG.BALL_R;
    p.ball.dy = -Math.abs(p.ball.dy);
    if (!store.muted) beep(440, 0.04, 'square', 0.10);
  }

  // Paddle collisions
  const lpx = 40, lpw = PONG.PADDLE_W;
  const rpx = W - 40 - PONG.PADDLE_W, rpw = PONG.PADDLE_W;

  if (p.ball.dx < 0 &&
      p.ball.x - PONG.BALL_R <= lpx + lpw &&
      p.ball.x - PONG.BALL_R >= lpx - 30 &&  // narrow tolerance to avoid clipping past
      p.ball.y >= p.paddleL.y - 4 &&
      p.ball.y <= p.paddleL.y + PONG.PADDLE_H + 4) {
    p.ball.x = lpx + lpw + PONG.BALL_R;
    pongPaddleHit('left', p.ball.y, p.paddleL.y);
  } else if (p.ball.dx > 0 &&
             p.ball.x + PONG.BALL_R >= rpx &&
             p.ball.x + PONG.BALL_R <= rpx + rpw + 30 &&
             p.ball.y >= p.paddleR.y - 4 &&
             p.ball.y <= p.paddleR.y + PONG.PADDLE_H + 4) {
    p.ball.x = rpx - PONG.BALL_R;
    pongPaddleHit('right', p.ball.y, p.paddleR.y);
  }

  // Goals
  if (p.ball.x < -PONG.BALL_R) {
    p.scoreR++;
    if (!store.muted) sfx.score();
    if (p.scoreR >= p.winScore) {
      pongFinish('right');
    } else {
      pongStartServe('right');
    }
  } else if (p.ball.x > W + PONG.BALL_R) {
    p.scoreL++;
    if (!store.muted) sfx.score();
    if (p.scoreL >= p.winScore) {
      pongFinish('left');
    } else {
      pongStartServe('left');
    }
  }
}

function drawPong() {
  const p = game.pong;
  if (!p) return;

  // On a portrait-orientation phone Pong is painfully cramped. Show a rotate
  // prompt instead and freeze the action until the user turns sideways.
  if (isPortraitMobile()) {
    drawRotatePrompt('Pong needs landscape mode for room to play');
    return;
  }

  // Court background — slightly different vibe than math game
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0a0a25');
  g.addColorStop(1, '#000814');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Center line
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.lineWidth = 3;
  ctx.setLineDash([14, 18]);
  ctx.beginPath();
  ctx.moveTo(W/2, 0);
  ctx.lineTo(W/2, H);
  ctx.stroke();
  ctx.restore();

  // Paddles
  ctx.save();
  ctx.fillStyle = '#56e2ff';
  ctx.shadowColor = '#56e2ff';
  ctx.shadowBlur = 18;
  roundRect(40, p.paddleL.y, PONG.PADDLE_W, PONG.PADDLE_H, 6);
  ctx.fill();
  ctx.fillStyle = '#ff7ad8';
  ctx.shadowColor = '#ff7ad8';
  roundRect(W - 40 - PONG.PADDLE_W, p.paddleR.y, PONG.PADDLE_W, PONG.PADDLE_H, 6);
  ctx.fill();
  ctx.restore();

  // Ball (only visible after intro & serve countdown done, but we'll always draw position-based)
  if (p.intro <= 0) {
    ctx.save();
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 24;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(p.ball.x, p.ball.y, PONG.BALL_R, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  // Header at the very top — small, doesn't compete with scores
  const narrow = W < 720;
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = 'bold 16px "Trebuchet MS"';
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillText(p.standalone ? 'PURE PONG  (easter egg)' : 'PONG INTERLUDE', W/2, 14);
  ctx.font = 'bold 11px "Trebuchet MS"';
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.fillText(
    p.standalone
      ? 'FIRST TO ' + p.winScore + '   •   tap PAUSE to quit'
      : 'FIRST TO ' + p.winScore + '   •   math match resumes after',
    W/2, 36
  );
  ctx.restore();

  // Scores BELOW the headers, on the sides. Smaller font on narrow.
  const scoreFontSize = narrow ? 60 : 80;
  const scoreY = 56;
  ctx.save();
  ctx.font = 'bold ' + scoreFontSize + 'px "Trebuchet MS"';
  ctx.textBaseline = 'top';
  ctx.shadowColor = '#56e2ff';
  ctx.shadowBlur = 16;
  ctx.fillStyle = '#56e2ff';
  ctx.textAlign = 'left';
  ctx.fillText(String(p.scoreL), narrow ? 24 : 60, scoreY);
  ctx.shadowColor = '#ff7ad8';
  ctx.fillStyle = '#ff7ad8';
  ctx.textAlign = 'right';
  ctx.fillText(String(p.scoreR), W - (narrow ? 24 : 60), scoreY);
  ctx.restore();

  // Pause button — top-center, between the corner scores. Tap to pause.
  const pbW = narrow ? 90 : 110;
  const pbH = 30;
  const pbX = W/2 - pbW/2;
  const pbY = 62;
  const pbHover = hitTest(mouseX, mouseY, { x: pbX, y: pbY, w: pbW, h: pbH });
  ctx.save();
  ctx.fillStyle = pbHover ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.10)';
  ctx.strokeStyle = pbHover ? 'rgba(255,255,255,0.7)' : 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 1.4;
  roundRect(pbX, pbY, pbW, pbH, 8);
  ctx.fill();
  ctx.stroke();
  ctx.font = 'bold 13px "Trebuchet MS"';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = pbHover ? '#fff' : 'rgba(255,255,255,0.85)';
  ctx.fillText('‖  PAUSE / QUIT', pbX + pbW/2, pbY + pbH/2);
  ctx.restore();
  hudPauseHitbox = { x: pbX, y: pbY, w: pbW, h: pbH };

  // Player name labels at bottom
  ctx.save();
  ctx.font = 'bold 18px "Trebuchet MS"';
  ctx.textBaseline = 'bottom';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(120,200,255,0.7)';
  ctx.fillText(game.paddleL.name, 60, H - 18);
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(255,150,220,0.7)';
  ctx.fillText(game.paddleR.name, W - 60, H - 18);
  ctx.restore();

  // Controls hint at bottom (only during intro)
  if (p.intro > 0) {
    ctx.save();
    ctx.font = 'bold 16px "Trebuchet MS"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText('LEFT:  W / S      RIGHT:  ↑ / ↓      (or touch your half of the screen to drag)', W/2, H - 60);
    ctx.restore();
  }

  // Serve countdown number in the middle
  if (p.serveCountdown > 0 && p.intro <= 0 && p.endCountdown === null) {
    const n = Math.ceil(p.serveCountdown);
    ctx.save();
    ctx.font = 'bold 120px "Trebuchet MS"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,255,255,' + (0.3 + 0.4 * (p.serveCountdown - Math.floor(p.serveCountdown))) + ')';
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 32;
    ctx.fillText(String(n), W/2, H/2);
    ctx.restore();
  }

  // Endgame banner
  if (p.endCountdown !== null && p.winnerSide) {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, W, H);
    const accent = p.winnerSide === 'left' ? '#56e2ff' : '#ff7ad8';
    ctx.font = 'bold 64px "Trebuchet MS"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = accent;
    ctx.shadowBlur = 32;
    ctx.fillStyle = accent;
    const winnerName = p.winnerSide === 'left' ? game.paddleL.name : game.paddleR.name;
    ctx.fillText(winnerName + (p.standalone ? ' WINS!' : ' WINS THE INTERLUDE'), W/2, H/2 - 30);
    ctx.shadowBlur = 0;
    ctx.font = 'bold 20px "Trebuchet MS"';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText(p.standalone ? 'Returning to menu...' : 'Math match resumes...', W/2, H/2 + 40);
    ctx.restore();
  }
}

function drawRotatePrompt(reason) {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.94)';
  ctx.fillRect(0, 0, W, H);

  const t = performance.now() / 1000;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Animated rotating arrow icon
  ctx.save();
  ctx.translate(W/2, H/2 - 110);
  ctx.rotate(Math.sin(t * 1.5) * 0.4);
  ctx.font = 'bold 96px "Trebuchet MS"';
  ctx.fillStyle = '#7fff90';
  ctx.shadowColor = '#7fff90';
  ctx.shadowBlur = 30;
  ctx.fillText('⟳', 0, 0);
  ctx.shadowBlur = 0;
  ctx.restore();

  ctx.font = 'bold 32px "Trebuchet MS"';
  ctx.fillStyle = '#fff';
  ctx.fillText('Rotate your phone', W/2, H/2 - 10);
  ctx.fillText('sideways', W/2, H/2 + 28);

  ctx.font = '16px "Trebuchet MS"';
  ctx.fillStyle = 'rgba(255,255,255,0.65)';
  ctx.fillText(reason, W/2, H/2 + 80);

  // Tappable "Back to menu" button
  const btnW = Math.min(240, W - 40);
  const btnH = 44;
  const btnX = W/2 - btnW/2;
  const btnY = H - 80;
  ctx.save();
  const blink = (Math.floor(t * 2) % 2) ? 1 : 0.6;
  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  ctx.strokeStyle = 'rgba(255,255,255,' + blink + ')';
  ctx.lineWidth = 2;
  roundRect(btnX, btnY, btnW, btnH, 10);
  ctx.fill();
  ctx.stroke();
  ctx.font = 'bold 16px "Trebuchet MS"';
  ctx.fillStyle = '#fff';
  ctx.fillText('Back to menu', W/2, btnY + btnH/2);
  ctx.restore();
  // Stash hitbox so click handler can dismiss
  game._rotateBackBtn = { x: btnX, y: btnY, w: btnW, h: btnH };

  ctx.restore();
}

function setupGameOverPhrases() {
  const winnerName = (game.winnerSide === 'left' ? game.paddleL.name : game.paddleR.name) || '';
  const loserName  = (game.winnerSide === 'left' ? game.paddleR.name : game.paddleL.name) || '';
  const wU = winnerName.toUpperCase();
  const lU = loserName.toUpperCase();

  let winPhrase = null;
  let losePhrase = null;

  // Mimi's reaction to losing — 25% chance, otherwise the usual game-over view.
  const mimiLose = NAME_PHRASES.MIMI && NAME_PHRASES.MIMI.lose;
  if (lU === 'MIMI' && mimiLose && mimiLose.length && Math.random() < PHRASE_CHANCE) {
    losePhrase = pick(mimiLose);
  }

  // Trey's victory line — only when he beats Mimi specifically. 25% chance.
  const treyVsMimi = NAME_PHRASES.TREY && NAME_PHRASES.TREY.winVsMimi;
  if (wU === 'TREY' && lU === 'MIMI' && treyVsMimi && treyVsMimi.length && Math.random() < PHRASE_CHANCE) {
    winPhrase = pick(treyVsMimi);
  }

  game.gameOverPhrases = { winPhrase, losePhrase };
}

function triggerSpectacle(side) {
  const kinds = ['lightning', 'volcano', 'tornado', 'meteor', 'aurora'];
  const kind = pick(kinds);
  game.effects.push({ kind, t: 0, side, seed: Math.random() * 1000 });
  sfx.spectacle();
  game.flash = { color: '#fff', a: 0.7 };
  game.shake = { mag: 18, t: 0.7 };
  game.toast = { text: 'STREAK x' + game.streak[side] + '!', t: 1.8, color: side === 'left' ? '#56e2ff' : '#ff7ad8' };
}

function updatePaddleMotion(p, dt) {
  const t = performance.now() / 1000;
  const phase = (p.side === 'left' ? 0 : Math.PI);
  const idleBob = Math.sin(t * 1.4 + phase) * 14;
  let target;
  let trackSpeed = 4;

  if (game.state === STATES.BALL) {
    const isReceiver = (game.current && game.current.side !== p.side);
    target = game.ball.y - p.h / 2;
    trackSpeed = isReceiver ? 9 : 5;
  } else if (game.state === STATES.PROBLEM) {
    if (game.current && game.current.side === p.side) {
      target = game.ball.y - p.h / 2 + Math.sin(t * 4 + phase) * 4;
      trackSpeed = 6;
    } else {
      target = H/2 - p.h/2 + idleBob;
      trackSpeed = 2.2;
    }
  } else if (game.state === STATES.RESULT) {
    target = p.y;
    trackSpeed = 3;
  } else {
    target = H/2 - p.h/2 + idleBob;
    trackSpeed = 2;
  }

  if (p.vibe > 0) {
    target += Math.sin(t * 35) * 6 * p.vibe;
    p.vibe = Math.max(0, p.vibe - dt * 1.6);
  }

  target = clamp(target, 8, H - p.h - 8);
  p.targetY = target;
  p.y = lerp(p.y, target, 1 - Math.exp(-trackSpeed * dt));
}

function spawnHitParticles(x, y, color) {
  for (let i = 0; i < 22; i++) {
    const a = randF(0, TAU);
    const s = randF(80, 360);
    game.particles.push({
      x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
      life: randF(0.4, 0.9), maxLife: 0.9, r: randF(2, 5), color, gravity: 280,
    });
  }
}

function spawnBallTrail() {
  game.ball.trail.push({ x: game.ball.x, y: game.ball.y, life: 0.45, color: game.ball.color });
  if (game.ball.trail.length > 40) game.ball.trail.shift();
}

let lastT = performance.now();
function loop() {
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

function update(dt) {
  // Background animation always runs (even when paused)
  for (const s of game.stars) {
    s.tw += dt * 2;
    s.x -= dt * 16 * s.z;
    if (s.x < -2) { s.x = W + 2; s.y = Math.random()*H; }
  }
  for (const p of game.particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += (p.gravity || 0) * dt;
    p.vx *= 0.985;
    p.life -= dt;
  }
  game.particles = game.particles.filter(p => p.life > 0);

  for (const t of game.ball.trail) t.life -= dt;
  game.ball.trail = game.ball.trail.filter(t => t.life > 0);

  if (game.shake.t > 0) game.shake.t -= dt;
  if (game.flash.a > 0) game.flash.a = Math.max(0, game.flash.a - dt * 1.6);
  if (game.toast.t > 0) game.toast.t -= dt;

  game.paddleL.pulse = Math.max(0, game.paddleL.pulse - dt * 3);
  game.paddleR.pulse = Math.max(0, game.paddleR.pulse - dt * 3);
  updatePaddleMotion(game.paddleL, dt);
  updatePaddleMotion(game.paddleR, dt);

  for (const e of game.effects) e.t += dt;
  game.effects = game.effects.filter(e => e.t < (e.kind === 'aurora' ? 3.2 : 1.8));

  // Game logic only when NOT paused
  if (game.paused) return;

  // 2-minute match cap — defensive against very long matches. If the wall
  // clock exceeds 120s and no winner has been declared, force-end the match
  // with whoever's leading. Versus modes only.
  const isVersus = game.mode === 'versus2p' || game.mode === 'versus1p';
  const inLiveMatch = isVersus && !game.winnerSide && game.matchStartTime > 0 &&
    (game.state === STATES.PROBLEM || game.state === STATES.BALL || game.state === STATES.RESULT);
  if (inLiveMatch && (performance.now() - game.matchStartTime) / 1000 > 120) {
    const winnerSide = game.score.left >= game.score.right ? 'left' : 'right';
    game.winnerSide = winnerSide;
    const winnerName = winnerSide === 'left' ? game.paddleL.name : game.paddleR.name;
    const loserName  = winnerSide === 'left' ? game.paddleR.name : game.paddleL.name;
    recordResult(winnerName, loserName);
    store.stats.gamesPlayed = (store.stats.gamesPlayed || 0) + 1;
    saveStore();
    setupGameOverPhrases();
    game.state = STATES.GAME_OVER;
