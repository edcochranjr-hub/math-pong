    game.toast = { text: '2:00 TIME — ' + winnerName + ' WINS', t: 2.6, color: '#ffe066' };
    if (!store.muted) sfx.score();
    return;
  }

  if (game.state === STATES.PROBLEM) {
    const cur = game.current;
    cur.timeRemaining = cur.timeLimit - (performance.now() - cur.startTime) / 1000;

    // CPU "thinking" — when the timer hits, simulate a submit
    if (game.cpu.thinking && cur.side === 'right' && game.mode === 'versus1p' && !cur.submitted) {
      game.cpu.elapsed += dt;
      if (game.cpu.elapsed >= game.cpu.target) {
        if (cur.problem.choices) {
          // Multi-choice: pick the correct choice (or a wrong one on a miss)
          const idx = game.cpu.willMiss
            ? pickWrongChoiceIndex(cur.problem)
            : cur.problem.correctIndex;
          cur.typed = String(cur.problem.choices[idx]);
        } else {
          cur.typed = String(cur.problem.answer + (game.cpu.willMiss ? game.cpu.missAmount : 0));
        }
        game.cpu.thinking = false;
        submitAnswer();
        return;
      }
    }

    if (cur.timeRemaining <= 0 && !cur.submitted) {
      cur.timeUsed = cur.timeLimit;
      cur.submitted = true;
      onWrong(true, null);
    }
  } else if (game.state === STATES.BALL) {
    const t = game.ball.travel;
    t.elapsed += dt;
    const k = clamp(t.elapsed / t.duration, 0, 1);
    const ek = easeInOut(k);
    game.ball.x = lerp(t.fromX, t.toX, ek);
    const arc = Math.sin(k * Math.PI) * (H * 0.2);
    game.ball.y = lerp(t.fromY, t.toY, ek) - arc;
    spawnBallTrail();
    if (k >= 1) {
      sfx.hit();
      const nextSide = game.current.side === 'left' ? 'right' : 'left';
      startRound(nextSide);
    }
  } else if (game.state === STATES.PONG) {
    updatePong(dt);
  } else if (game.state === STATES.RESULT) {
    if (game.ball.travel) {
      const t = game.ball.travel;
      t.elapsed += dt;
      const k = clamp(t.elapsed / t.duration, 0, 1);
      game.ball.x = lerp(t.fromX, t.toX, k);
      game.ball.y = lerp(t.fromY, t.toY, k);
      spawnBallTrail();
    }
    game.stateTimer -= dt;
    if (game.stateTimer <= 0) {
      if (game.winnerSide) {
        game.state = STATES.GAME_OVER;
        setupGameOverPhrases();
        sfx.score();
      } else if (game.mode === 'practice') {
        startRound('left');
      } else {
        startRound(game.current.side); // loser serves
      }
    }
  }
}

function render() {
  ctx.save();
  if (game.shake.t > 0) {
    const m = game.shake.mag * game.shake.t;
    ctx.translate(randF(-m, m), randF(-m, m));
  }

  drawBackground();
  drawStars();

  // Self-contained screens render their own backgrounds — skip the math overlays.
  const standaloneScreens = [STATES.PONG, STATES.EASTER_MESSAGE, STATES.HELP, STATES.RECORDS];
  if (!standaloneScreens.includes(game.state)) {
    drawEffectsBack();
    drawCenterLine();
    drawPaddles();
    drawBallTrail();
    drawBall();
  }

  const noHUDStates = [STATES.TITLE, STATES.NAME_ENTRY, STATES.PRACTICE_MENU, STATES.CUSTOM_SETUP,
                       STATES.PONG, STATES.EASTER_MESSAGE, STATES.HELP, STATES.RECORDS];
  if (!noHUDStates.includes(game.state)) {
    drawHUD();
  }

  // Spectacle effects (lightning / volcano / tornado / meteor) render BEFORE
  // the state-specific UI so they don't obscure the problem panel + keypad
  // numbers. Background-layer effects (aurora) already drew earlier behind
  // the paddles.
  drawEffectsFront();

  if (game.state === STATES.TITLE) drawTitle();
  else if (game.state === STATES.NAME_ENTRY) drawNameEntry();
  else if (game.state === STATES.PRACTICE_MENU) drawPracticeMenu();
  else if (game.state === STATES.CUSTOM_SETUP) drawCustomSetup();
  else if (game.state === STATES.EASTER_MESSAGE) drawEasterMessage();
  else if (game.state === STATES.HELP) drawHelp();
  else if (game.state === STATES.RECORDS) drawRecords();
  else if (game.state === STATES.PONG) drawPong();
  else if (game.state === STATES.PROBLEM) drawProblem();
  else if (game.state === STATES.GAME_OVER) drawGameOver();

  drawToast();

  if (game.paused) drawPauseOverlay();

  ctx.restore();

  if (game.flash.a > 0) {
    ctx.fillStyle = game.flash.color;
    ctx.globalAlpha = game.flash.a;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
}

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#0a0a25');
  g.addColorStop(0.5, '#13002b');
  g.addColorStop(1, '#22001a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const r = ctx.createRadialGradient(W*0.5, H*0.5, Math.min(W,H)*0.1, W*0.5, H*0.5, Math.max(W,H)*0.7);
  r.addColorStop(0, 'rgba(120,40,200,0.18)');
  r.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = r;
  ctx.fillRect(0, 0, W, H);
}

function drawStars() {
  for (const s of game.stars) {
    const a = 0.4 + 0.5 * Math.sin(s.tw);
    ctx.globalAlpha = a * s.z;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawCenterLine() {
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 2;
  ctx.setLineDash([10, 14]);
  ctx.beginPath();
  ctx.moveTo(W/2, 0);
  ctx.lineTo(W/2, H);
  ctx.stroke();
  ctx.restore();
}

function drawPaddle(p) {
  const grad = ctx.createLinearGradient(p.x, p.y, p.x + p.w, p.y + p.h);
  grad.addColorStop(0, p.color1);
  grad.addColorStop(1, p.color2);

  ctx.save();
  ctx.shadowColor = p.color1;
  ctx.shadowBlur = 20 + p.pulse * 50;
  ctx.fillStyle = grad;
  const expand = p.pulse * 4;
  roundRect(p.x - expand/2, p.y - expand/2, p.w + expand, p.h + expand, 6);
  ctx.fill();

  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  roundRect(p.x + 2, p.y + 4, 3, p.h - 8, 2);
  ctx.fill();
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawPaddles() {
  drawPaddle(game.paddleL);
  drawPaddle(game.paddleR);
}

function drawBallTrail() {
  for (const t of game.ball.trail) {
    const a = clamp(t.life / 0.45, 0, 1);
    ctx.globalAlpha = a * 0.6;
    ctx.fillStyle = t.color;
    ctx.beginPath();
    ctx.arc(t.x, t.y, game.ball.r * (0.4 + 0.6*a), 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawBall() {
  if (game.state === STATES.TITLE || game.state === STATES.NAME_ENTRY ||
      game.state === STATES.PRACTICE_MENU || game.state === STATES.CUSTOM_SETUP) return;
  ctx.save();
  ctx.shadowColor = game.ball.color;
  ctx.shadowBlur = 30;
  const grad = ctx.createRadialGradient(game.ball.x - 4, game.ball.y - 4, 1, game.ball.x, game.ball.y, game.ball.r);
  grad.addColorStop(0, '#fff');
  grad.addColorStop(0.6, game.ball.color);
  grad.addColorStop(1, '#222');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(game.ball.x, game.ball.y, game.ball.r, 0, TAU);
  ctx.fill();
  ctx.restore();

  for (const p of game.particles) {
    const a = clamp(p.life / p.maxLife, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * a, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  const tier = difficultyTier();
  const narrow = W < 720;
  // Scale the giant score font down on narrow screens so it doesn't overlap
  // the level label in the top-center.
  const scoreFontSize = narrow ? 56 : 96;
  const scoreOffsetX = narrow ? 28 : 60;
  const scoreY = narrow ? 14 : 24;

  // Scores (versus) or solved count (practice/custom)
  const isSolo = game.mode === 'practice' || game.mode === 'custom';
  ctx.save();
  if (!isSolo) {
    ctx.font = 'bold ' + scoreFontSize + 'px "Trebuchet MS"';
    ctx.textBaseline = 'top';
    ctx.shadowColor = '#56e2ff';
    ctx.shadowBlur = 18;
    ctx.fillStyle = 'rgba(120,200,255,0.85)';
    ctx.textAlign = 'left';
    ctx.fillText(String(game.score.left), scoreOffsetX, scoreY);

    ctx.shadowColor = '#ff7ad8';
    ctx.fillStyle = 'rgba(255,150,220,0.85)';
    ctx.textAlign = 'right';
    ctx.fillText(String(game.score.right), W - scoreOffsetX, scoreY);
  } else {
    ctx.font = 'bold ' + (narrow ? 28 : 36) + 'px "Trebuchet MS"';
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#7fff90';
    ctx.shadowColor = '#7fff90';
    ctx.shadowBlur = 12;
    ctx.fillText('SOLVED ' + game.totalCorrect, scoreOffsetX, scoreY + 4);
  }
  ctx.restore();

  // Streaks
  ctx.save();
  ctx.font = 'bold 22px "Trebuchet MS"';
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#ffe066';
  if (isSolo) {
    ctx.textAlign = 'left';
    if (game.streak.left > 0) ctx.fillText('STREAK ' + game.streak.left, 60, 80);
  } else {
    ctx.textAlign = 'left';
    if (game.streak.left > 0) ctx.fillText('STREAK ' + game.streak.left, 64, 130);
    ctx.textAlign = 'right';
    if (game.streak.right > 0) ctx.fillText('STREAK ' + game.streak.right, W - 64, 130);
  }
  ctx.restore();

  // Top center
  ctx.save();
  ctx.font = 'bold 18px "Trebuchet MS"';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  if (game.mode === 'practice') {
    ctx.fillText('PRACTICE — ' + PRACTICE_OP_LABELS[game.practiceOp], W/2, 28);
    ctx.font = 'bold 14px "Trebuchet MS"';
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillText('LEVEL ' + tier + '   ' + tierName(tier) + '   •   ESC to quit', W/2, 56);
  } else if (game.mode === 'custom') {
    const enabled = CUSTOM_OPS_ORDER.filter(o => game.customSetup.ops[o]);
    const opSummary = enabled.map(o => ({add:'+',sub:'−',mul:'×',div:'÷',pow:'^',alg:'x'})[o]).join(' ');
    ctx.fillText('CUSTOM   ' + opSummary, W/2, 28);
    ctx.font = 'bold 14px "Trebuchet MS"';
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillText('DIFFICULTY ' + game.customSetup.difficulty + ' — ' +
                 CUSTOM_DIFF_LABELS[game.customSetup.difficulty - 1].split('  ')[0] + '   •   ESC to quit', W/2, 56);
  } else {
    ctx.fillText('LEVEL ' + tier + '   ' + tierName(tier), W/2, 28);
    ctx.font = 'bold 14px "Trebuchet MS"';
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    const modeTag = game.mode === 'versus1p' ? '1P vs CPU' : '2 PLAYER';
    ctx.fillText('FIRST TO ' + WIN_SCORE + '  •  ' + curDiff().name.replace(/\s+/g, ' ') + '  •  ' + modeTag, W/2, 56);
  }
  ctx.restore();

  // Player labels
  if (!isSolo) {
    ctx.save();
    ctx.font = 'bold 18px "Trebuchet MS"';
    ctx.textBaseline = 'bottom';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(120,200,255,0.7)';
    ctx.fillText(game.paddleL.name, 60, H - 24);
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(255,150,220,0.7)';
    ctx.fillText(game.paddleR.name, W - 60, H - 24);
    ctx.restore();
  }

  // Mute indicator (small, corner)
  if (store.muted) {
    ctx.save();
    ctx.font = 'bold 12px "Trebuchet MS"';
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(255,120,90,0.7)';
    ctx.fillText('MUTED  (M)', W - 16, H - 8);
    ctx.restore();
  }

  // === PAUSE BUTTON (top-center, just below the level/diff line) ===
  // Tappable on touch, also serves as a visible cue on desktop. Hidden on
  // game-over since there's nothing to pause then.
  if (game.state === STATES.PROBLEM || game.state === STATES.BALL || game.state === STATES.RESULT) {
    const pbW = 90, pbH = 28;
    const pbX = W/2 - pbW/2;
    const pbY = narrow ? 80 : 86;
    const hovered = hitTest(mouseX, mouseY, { x: pbX, y: pbY, w: pbW, h: pbH });
    ctx.save();
    ctx.fillStyle = hovered ? 'rgba(255,255,255,0.20)' : 'rgba(255,255,255,0.08)';
    ctx.strokeStyle = hovered ? 'rgba(255,255,255,0.6)' : 'rgba(255,255,255,0.30)';
    ctx.lineWidth = 1.4;
    roundRect(pbX, pbY, pbW, pbH, 8);
    ctx.fill();
    ctx.stroke();
    ctx.font = 'bold 13px "Trebuchet MS"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = hovered ? '#fff' : 'rgba(255,255,255,0.85)';
    ctx.fillText('‖  PAUSE', pbX + pbW/2, pbY + pbH/2);
    ctx.restore();
    hudPauseHitbox = { x: pbX, y: pbY, w: pbW, h: pbH };
  } else {
    hudPauseHitbox = null;
  }
}

function drawPauseOverlay() {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, W, H);
  ctx.font = 'bold 84px "Trebuchet MS"';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffe066';
  ctx.shadowColor = '#ffe066';
  ctx.shadowBlur = 32;
  ctx.fillText('PAUSED', W/2, H/2 - 60);
  ctx.shadowBlur = 0;

  // Two big tap-friendly buttons: Resume and Quit to Menu
  pauseOverlayButtons = [];
  const btnW = Math.min(280, W - 60);
  const btnH = 54;
  const btnGap = 16;

  // Resume (green)
  const resumeY = H/2 + 10;
  const resumeX = W/2 - btnW/2;
  drawButton(resumeX, resumeY, btnW, btnH, 'RESUME', '#7fff90');
  pauseOverlayButtons.push({ x: resumeX, y: resumeY, w: btnW, h: btnH, action: 'resume' });

  // Quit (red)
  const quitY = resumeY + btnH + btnGap;
  const quitX = W/2 - btnW/2;
  drawButton(quitX, quitY, btnW, btnH, 'QUIT TO MAIN MENU', '#ff7ad8');
  pauseOverlayButtons.push({ x: quitX, y: quitY, w: btnW, h: btnH, action: 'quit' });

  // Keyboard hints below
  ctx.font = '13px "Trebuchet MS"';
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText('keyboard:  P resume   •   Q quit', W/2, quitY + btnH + 30);
  ctx.restore();
}

function drawProblem() {
  const cur = game.current;
  const side = cur.side;
  const accent = side === 'left' ? '#56e2ff' : '#ff7ad8';
  const narrow = W < 720;
  const isCPU = game.mode === 'versus1p' && side === 'right';
  const showKeypad = !cur.problem.choices && !isCPU;
  // When the viewport is short (landscape phone) and we'd be showing the
  // keypad, lay panel + keypad out side-by-side so both fit. Otherwise the
  // default vertical-stack layout (panel above, keypad below).
  const sideBySideKeypad = showKeypad && H < 560 && W >= 600;
  const panelH = cur.problem.choices ? 340 : 280;

  let halfX, panelX, panelY, panelW, kpX, kpY, kpAreaW;

  if (sideBySideKeypad) {
    // Landscape-phone layout: panel on the left, keypad on the right
    const margin = 14;
    panelW = Math.min(W * 0.46 - margin, 480);
    panelX = (W / 2) - panelW - margin / 2;
    halfX = panelX + panelW / 2;
    panelY = clamp((H - panelH) / 2, 8, H - panelH - 8);
    kpAreaW = Math.min(W * 0.46 - margin, 480);
    kpX = (W / 2) + margin / 2;
    kpY = clamp((H - 268) / 2, 8, H - 268 - 8);
  } else {
    // Default layout: panel centered (narrow) or to one side (wide), keypad below
    halfX = narrow ? W / 2 : (side === 'left' ? W * 0.27 : W * 0.73);
    panelW = narrow ? Math.min(W - 30, 560) : Math.min(W * 0.42, 560);
    panelX = halfX - panelW / 2;
    const totalContentH = panelH + (showKeypad ? 14 + 268 : 0);
    panelY = clamp(Math.round(H / 2 - totalContentH / 2), 50, H - totalContentH - 12);
    kpAreaW = 440;
    kpX = W / 2 - kpAreaW / 2;
    kpY = panelY + panelH + 14;
  }

  ctx.save();
  ctx.shadowColor = accent;
  ctx.shadowBlur = 24;
  ctx.fillStyle = 'rgba(10, 10, 30, 0.78)';
  roundRect(panelX, panelY, panelW, panelH, 18);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.lineWidth = 3;
  ctx.strokeStyle = accent;
  ctx.stroke();

  const playerName = side === 'left' ? game.paddleL.name : game.paddleR.name;
  const headerText = isCPU ? 'CPU — THINKING…' : (playerName + ' — SOLVE!');

  ctx.font = 'bold 22px "Trebuchet MS"';
  ctx.textAlign = 'center';
  ctx.fillStyle = accent;
  ctx.fillText(headerText, halfX, panelY + 38);

  // Algebra problems include "x =" in their text already; everything else gets "= ?".
  ctx.font = cur.problem.isAlgebra ? 'bold 60px "Trebuchet MS"' : 'bold 76px "Trebuchet MS"';
  ctx.fillStyle = '#fff';
  ctx.shadowColor = accent;
  ctx.shadowBlur = 14;
  const displayText = cur.problem.isAlgebra ? cur.problem.text : (cur.problem.text + ' = ?');
  ctx.fillText(displayText, halfX, panelY + 120);
  ctx.shadowBlur = 0;

  if (cur.problem.choices) {
    // Multi-choice: render 4 options in a 2x2 grid; track hitboxes for tap.
    mcChoiceHitboxes = [];
    const cellW = (panelW - 80) / 2;
    const cellH = 50;  // slightly taller for thumb-friendly tap targets
    const gapX = 14;
    const gapY = 12;
    const gridCenterY = panelY + 215;
    const hovered = !isCPU; // hover effect only when human is solving
    for (let i = 0; i < cur.problem.choices.length; i++) {
      const col = i % 2;
      const row = Math.floor(i / 2);
      const cx = halfX + (col === 0 ? -1 : 1) * (cellW/2 + gapX/2);
      const cy = gridCenterY + (row === 0 ? -1 : 1) * (cellH/2 + gapY/2);
      const cellTop = cy - cellH/2;
      const cellLeft = cx - cellW/2;

      // Track hitbox for tap detection
      mcChoiceHitboxes.push({ x: cellLeft, y: cellTop, w: cellW, h: cellH });

      // Hover-style highlight if mouse is over (desktop nicety)
      const isHover = hovered && hitTest(mouseX, mouseY, mcChoiceHitboxes[i]);

      // Pill background
      ctx.fillStyle = isCPU ? 'rgba(255,255,255,0.04)' : (isHover ? 'rgba(255,255,255,0.20)' : 'rgba(255,255,255,0.10)');
      ctx.strokeStyle = isHover ? accent : 'rgba(255,255,255,0.22)';
      ctx.lineWidth = isHover ? 2 : 1;
      ctx.shadowColor = accent;
      ctx.shadowBlur = isHover ? 14 : 0;
      roundRect(cellLeft, cellTop, cellW, cellH, 8);
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Index label (top-left of pill)
      ctx.font = 'bold 13px "Trebuchet MS"';
      ctx.fillStyle = accent;
      ctx.textAlign = 'left';
      ctx.fillText('[' + (i + 1) + ']', cellLeft + 12, cy);

      // Choice value (centered)
      ctx.font = 'bold 26px "Trebuchet MS"';
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.fillText(String(cur.problem.choices[i]), cx + 14, cy);
    }
    // CPU thinking indicator below the grid
    if (isCPU) {
      const dotCount = 1 + Math.floor((performance.now() / 320) % 3);
      ctx.font = 'bold 18px "Trebuchet MS"';
      ctx.fillStyle = '#ffe066';
      ctx.textAlign = 'center';
      ctx.fillText('CPU is choosing' + '.'.repeat(dotCount), halfX, gridCenterY + cellH + 30);
    }
  } else {
    mcChoiceHitboxes = [];
    ctx.font = 'bold 56px "Trebuchet MS"';
    ctx.fillStyle = '#ffe066';
    if (isCPU) {
      const dotCount = 1 + Math.floor((performance.now() / 320) % 3);
      ctx.fillText('.'.repeat(dotCount), halfX, panelY + 200);
    } else {
      const cursor = (Math.floor(performance.now() / 380) % 2) ? '_' : ' ';
      const typedDisplay = (cur.typed.length > 0 ? cur.typed : '') + cursor;
      ctx.fillText(typedDisplay, halfX, panelY + 200);
    }
  }

  // Timer bar
  const barW = panelW - 60;
  const barH = 14;
  const barX = panelX + 30;
  const barY = panelY + panelH - 30;
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  roundRect(barX, barY, barW, barH, 6);
  ctx.fill();
  const frac = clamp(cur.timeRemaining / cur.timeLimit, 0, 1);
  const tcol = frac > 0.5 ? '#7fff90' : frac > 0.25 ? '#ffe066' : '#ff5577';
  ctx.fillStyle = tcol;
  ctx.shadowColor = tcol;
  ctx.shadowBlur = 12;
  roundRect(barX, barY, barW * frac, barH, 6);
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.font = 'bold 16px "Trebuchet MS"';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText(cur.timeRemaining.toFixed(1) + 's  /  ' + cur.timeLimit.toFixed(1) + 's', halfX, barY - 8);
  ctx.restore();

  // === ON-SCREEN NUMBER KEYPAD (typing mode only, hidden during CPU's turn) ===
  if (showKeypad) {
    drawKeypad(kpX, kpY, kpAreaW);
  } else {
    keypadHitboxes = [];
  }
}

// Render a 3-column number keypad with backspace, negative, and a wide SUBMIT
// button. Updates keypadHitboxes for the click handler.
function drawKeypad(xLeft, yTop, areaW) {
  keypadHitboxes = [];
  const cols = 3;
  const padW = Math.min(areaW - 6, 440);
  const padX = xLeft + (areaW - padW) / 2;
  const gap = 8;
  const keyW = (padW - gap * (cols - 1)) / cols;
  const keyH = 44;

  const layout = ['7','8','9','4','5','6','1','2','3','−','0','⌫'];
  for (let i = 0; i < layout.length; i++) {
    const r = Math.floor(i / cols);
    const c = i % cols;
    const kx = padX + c * (keyW + gap);
    const ky = yTop + r * (keyH + gap);
    drawKey(kx, ky, keyW, keyH, layout[i], false);
    keypadHitboxes.push({ x: kx, y: ky, w: keyW, h: keyH, key: layout[i] });
  }

  // Submit row spans the full keypad width
  const submitY = yTop + 4 * (keyH + gap);
  const submitH = 50;
  drawKey(padX, submitY, padW, submitH, 'SUBMIT', true);
  keypadHitboxes.push({ x: padX, y: submitY, w: padW, h: submitH, key: 'SUBMIT' });
}

function drawKey(x, y, w, h, label, isSubmit) {
  const hovered = hitTest(mouseX, mouseY, { x, y, w, h });
  ctx.save();
  if (isSubmit) {
    // Solid green submit key — always readable
    const grad = ctx.createLinearGradient(x, y, x, y + h);
    grad.addColorStop(0, hovered ? 'rgba(127,255,144,0.70)' : 'rgba(127,255,144,0.50)');
    grad.addColorStop(1, hovered ? 'rgba(60,200,80,0.55)' : 'rgba(60,200,80,0.30)');
    ctx.fillStyle = grad;
    ctx.strokeStyle = '#7fff90';
    ctx.lineWidth = hovered ? 2.6 : 1.8;
    ctx.shadowColor = '#7fff90';
    ctx.shadowBlur = hovered ? 20 : 0;
  } else {
    // Solid dark key — visible against ANY background (stars, spectacle FX,
    // bright flashes, etc). Calculator-style.
    const grad = ctx.createLinearGradient(x, y, x, y + h);
    grad.addColorStop(0, hovered ? 'rgba(70,90,150,0.96)'  : 'rgba(40,55,105,0.94)');
    grad.addColorStop(1, hovered ? 'rgba(45,60,115,0.96)'  : 'rgba(20,30,75,0.94)');
    ctx.fillStyle = grad;
    ctx.strokeStyle = hovered ? '#56e2ff' : 'rgba(255,255,255,0.55)';
    ctx.lineWidth = hovered ? 2.2 : 1.5;
  }
  roundRect(x, y, w, h, 9);
  ctx.fill();
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.font = 'bold ' + Math.round(h * (isSubmit ? 0.44 : 0.55)) + 'px "Trebuchet MS"';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  // Subtle drop shadow on the digit so it pops over any underlying gradient
  ctx.shadowColor = 'rgba(0,0,0,0.6)';
  ctx.shadowBlur = 2;
  ctx.shadowOffsetY = 1;
  ctx.fillText(label, x + w/2, y + h/2);
  ctx.restore();
}

// Hitbox for the easter-egg icon, refreshed every frame in drawTitle. Used by
// the canvas click/tap handler to decide if a click landed on the egg.
let easterEggHitbox = null;

function drawEasterEggIcon(cx, cy, size, t) {
  ctx.save();
  // Gentle pulse so the eye catches it
  const pulse = 0.85 + 0.15 * Math.sin(t * 1.8);
  ctx.globalAlpha = pulse;

  // Egg body — oval, slightly more vertical than horizontal
  ctx.fillStyle = '#fff5d6';
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.ellipse(cx, cy, size * 0.42, size * 0.55, 0, 0, TAU);
  ctx.fill();
  ctx.stroke();

  // Two decorative bands (zigzag-ish stripes)
  ctx.strokeStyle = '#ff7ad8';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(cx - size * 0.36, cy - size * 0.08);
  ctx.lineTo(cx - size * 0.12, cy - size * 0.18);
  ctx.lineTo(cx + size * 0.12, cy - size * 0.08);
  ctx.lineTo(cx + size * 0.36, cy - size * 0.18);
  ctx.stroke();
  ctx.strokeStyle = '#56e2ff';
  ctx.beginPath();
  ctx.moveTo(cx - size * 0.36, cy + size * 0.18);
  ctx.lineTo(cx - size * 0.12, cy + size * 0.08);
  ctx.lineTo(cx + size * 0.12, cy + size * 0.18);
  ctx.lineTo(cx + size * 0.36, cy + size * 0.08);
  ctx.stroke();

  // Dots between bands
  ctx.fillStyle = '#7fff90';
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath();
    ctx.arc(cx + i * size * 0.22, cy + size * 0.32, 1.6, 0, TAU);
    ctx.fill();
  }

  ctx.restore();
}

function drawTitle() {
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const t = performance.now() / 1000;

  titleExtras = {}; // refresh hitboxes
  const narrow = W < 720;
  // === TOP: title + subtitle (anchored from top) ===
  // Title font scales down on narrow / portrait screens so it doesn't overflow.
  const titleFontSize = Math.min(92, W * 0.16);
  ctx.font = 'bold ' + titleFontSize + 'px "Trebuchet MS"';
  const grad = ctx.createLinearGradient(0, 40, 0, 130);
  grad.addColorStop(0, '#56e2ff');
  grad.addColorStop(1, '#ff7ad8');
  ctx.fillStyle = grad;
  ctx.shadowColor = '#a855f7';
  ctx.shadowBlur = 32 + Math.sin(t * 2) * 8;
  ctx.fillText('MATH PONG', W/2, 78);
  ctx.shadowBlur = 0;

  ctx.font = 'bold 20px "Trebuchet MS"';
  ctx.fillStyle = '#fff';
  ctx.fillText('Family Math Battle', W/2, 130);

  ctx.font = '13px "Trebuchet MS"';
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.fillText('Solve fast — the quicker you answer, the LESS time the other player gets.', W/2, 156);
  ctx.fillText('5 in a row triggers SPECIAL effects.', W/2, 174);

  // Friendly nudge for phones held in portrait — Pong needs landscape.
  if (isPortraitMobile()) {
    ctx.font = 'bold 12px "Trebuchet MS"';
    ctx.fillStyle = 'rgba(255,224,102,0.85)';
    ctx.fillText('Tip: turn your phone sideways for the best experience', W/2, 192);
  }

  // === MODE + DIFFICULTY ===
  // On wide screens these sit side-by-side. On narrow (phones / portrait) they
  // stack vertically so each gets the full width. Each label has tappable
  // chevron buttons on either side for touch-screen cycling.
  const modeLabels = {
    versus2p: '2 PLAYERS',
    versus1p: '1 PLAYER vs CPU',
    practice: 'PRACTICE MODE',
    custom:   'CUSTOM',
  };
  const modeBlurbs = {
    versus2p: 'Same keyboard, taking turns. First to 7.',
    versus1p: 'Solo vs the computer. Difficulty sets CPU speed & accuracy.',
    practice: 'Drill one operation. No score, just streak.',
    custom:   'Pick ops + how big the numbers get. Algebra too.'
  };

  const chevSize = 38;
  const chevOffset = narrow ? Math.min(W * 0.32, 130) : 110;
  let colMode, colDiff, modeHeaderY, modeLabelY, modeBlurbY, diffHeaderY, diffLabelY, diffBlurbY, diffBlurb2Y;
  if (narrow) {
    colMode = W / 2;
    colDiff = W / 2;
    modeHeaderY = 196;
    modeLabelY  = 226;
    modeBlurbY  = 252;
    diffHeaderY = 286;
    diffLabelY  = 316;
    diffBlurbY  = 342;
    diffBlurb2Y = 360;
  } else {
    colMode = W * 0.27;
    colDiff = W * 0.73;
    modeHeaderY = 220;
    modeLabelY  = 252;
    modeBlurbY  = 280;
    diffHeaderY = 220;
    diffLabelY  = 252;
    diffBlurbY  = 280;
    diffBlurb2Y = 300;
  }

  // MODE
  ctx.font = 'bold 13px "Trebuchet MS"';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.textAlign = 'center';
  ctx.fillText('MODE', colMode, modeHeaderY);

  titleExtras.modeUp   = drawChevButton(colMode - chevOffset, modeLabelY, chevSize, '◀');
  titleExtras.modeDown = drawChevButton(colMode + chevOffset, modeLabelY, chevSize, '▶');

  ctx.font = 'bold 26px "Trebuchet MS"';
  ctx.fillStyle = '#7fff90';
  ctx.shadowColor = '#7fff90';
  ctx.shadowBlur = 12;
  ctx.fillText(modeLabels[game.mode], colMode, modeLabelY);
  ctx.shadowBlur = 0;

  ctx.font = '11px "Trebuchet MS"';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText(modeBlurbs[game.mode], colMode, modeBlurbY);

  // DIFFICULTY
  const diff = curDiff();
  ctx.font = 'bold 13px "Trebuchet MS"';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText('DIFFICULTY', colDiff, diffHeaderY);

  titleExtras.diffLeft  = drawChevButton(colDiff - chevOffset, diffLabelY, chevSize, '◀');
  titleExtras.diffRight = drawChevButton(colDiff + chevOffset, diffLabelY, chevSize, '▶');

  ctx.font = 'bold 22px "Trebuchet MS"';
  const dColor = ['#7fff90', '#ffe066', '#ff7ad8'][diffIdx];
  ctx.fillStyle = dColor;
  ctx.shadowColor = dColor;
  ctx.shadowBlur = 10;
  ctx.fillText(diff.name, colDiff, diffLabelY);
  ctx.shadowBlur = 0;

  ctx.font = '11px "Trebuchet MS"';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText(diff.blurb, colDiff, diffBlurbY);
  if (!narrow) ctx.fillText('Min ' + diff.minTime.toFixed(1) + 's   •   Max ' + diff.maxTime.toFixed(1) + 's', colDiff, diffBlurb2Y);

  // === BOTTOM-ANCHORED STACK (built upward from H so it never collides) ===
  let y = H - 18;
  titleButtons = []; // refresh hitboxes every frame

  // Mute warning at very bottom (only if muted)
  if (store.muted) {
    ctx.font = 'bold 12px "Trebuchet MS"';
    ctx.fillStyle = '#ff7755';
    ctx.textAlign = 'center';
    ctx.fillText('SOUND MUTED   (press M to unmute)', W/2, y);
    y -= 22;
  }

  // Two side-by-side buttons. Sizes adapt to screen width.
  const btnGap = 18;
  const btnH = narrow ? 48 : 54;
  const btnW = narrow ? Math.min(180, (W - 60 - btnGap) / 2) : 250;
  const btnTotalW = btnW * 2 + btnGap;
  const btnX0 = W/2 - btnTotalW/2;
  const btnY = y - btnH - 4;

  const helpLabel = narrow ? 'HELP' : 'HELP HELP ME RHONDA';
  const helpSub = narrow ? null : 'controls & how to play';
  drawButton(btnX0, btnY, btnW, btnH, helpLabel, '#56e2ff', helpSub);
  titleButtons.push({ x: btnX0, y: btnY, w: btnW, h: btnH, action: 'help' });

  const s = store.stats;
  const recordsLabel = narrow ? 'RECORDS' : 'MY RECORDS';
  const recordsSub = narrow ? null : ((s.totalSolved||0) + ' solved · best streak ' + (s.bestStreak||0));
  drawButton(btnX0 + btnW + btnGap, btnY, btnW, btnH, recordsLabel, '#ffe066', recordsSub);
  titleButtons.push({ x: btnX0 + btnW + btnGap, y: btnY, w: btnW, h: btnH, action: 'records' });

  y = btnY - 18;

  // INPUT mode indicator (multiple choice toggle) — plain language for kids.
  // Whole line is tappable on touch.
  ctx.font = 'bold 15px "Trebuchet MS"';
  ctx.fillStyle = game.multiChoice ? '#7fff90' : '#fff';
  ctx.textAlign = 'center';
  const inputDesc = game.multiChoice
    ? 'Multiple Choice   •   tap or press C to Type instead'
    : 'Type the answer   •   tap or press C for Multiple Choice';
  ctx.fillText(inputDesc, W/2, y);
  // Register tappable hitbox for the toggle line
  const mcLineW = ctx.measureText(inputDesc).width;
  titleExtras.mcToggle = { x: W/2 - mcLineW/2 - 12, y: y - 14, w: mcLineW + 24, h: 28 };
  y -= 36;

  // === FULLSCREEN button (touch only — desktop already has its window) ===
  // Pulled in above the START button so it's the natural first thing to tap
  // when the player wants to lose the browser URL bar.
  if (isTouchDevice) {
    const fsW = Math.min(220, W - 60);
    const fsH = 32;
    const fsX = W/2 - fsW/2;
    const fsY = y - fsH;
    const fsHover = hitTest(mouseX, mouseY, { x: fsX, y: fsY, w: fsW, h: fsH });
    ctx.save();
    ctx.fillStyle = fsHover ? 'rgba(86,226,255,0.25)' : 'rgba(86,226,255,0.10)';
    ctx.strokeStyle = fsHover ? '#56e2ff' : 'rgba(86,226,255,0.5)';
    ctx.lineWidth = 1.5;
    roundRect(fsX, fsY, fsW, fsH, 8);
    ctx.fill();
    ctx.stroke();
    ctx.font = 'bold 13px "Trebuchet MS"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = fsHover ? '#fff' : '#56e2ff';
    ctx.fillText(isFullscreen() ? '⛶  EXIT FULLSCREEN' : '⛶  GO FULLSCREEN', fsX + fsW/2, fsY + fsH/2);
    ctx.restore();
    titleButtons.push({ x: fsX, y: fsY, w: fsW, h: fsH, action: 'fullscreen' });
    y = fsY - 14;
  }

  // === BIG START BUTTON (solid green, always visible) ===
  // The ONLY way to begin a game (besides keyboard SPACE/Enter). No more
  // tap-anywhere starts — too easy to trigger accidentally.
  const startBtnW = Math.min(320, W - 60);
  const startBtnH = 58;
  const startBtnX = W/2 - startBtnW/2;
  const startBtnY = y - startBtnH;
  const startLabel = (game.mode === 'practice' || game.mode === 'custom')
    ? 'NEXT  →  SET UP'
    : 'START GAME';
  const sbHover = hitTest(mouseX, mouseY, { x: startBtnX, y: startBtnY, w: startBtnW, h: startBtnH });
  ctx.save();
  // Green-filled gradient body — always visible (not just on hover)
  const sbGrad = ctx.createLinearGradient(startBtnX, startBtnY, startBtnX, startBtnY + startBtnH);
  sbGrad.addColorStop(0, sbHover ? 'rgba(127,255,144,0.55)' : 'rgba(127,255,144,0.35)');
  sbGrad.addColorStop(1, sbHover ? 'rgba(127,255,144,0.18)' : 'rgba(127,255,144,0.08)');
  ctx.fillStyle = sbGrad;
  ctx.strokeStyle = '#7fff90';
  ctx.lineWidth = sbHover ? 3 : 2;
  // Pulsing glow draws the eye without changing the button's opacity
  ctx.shadowColor = '#7fff90';
  ctx.shadowBlur = sbHover ? 32 : (18 + 10 * Math.sin(t * 2.4));
  roundRect(startBtnX, startBtnY, startBtnW, startBtnH, 14);
  ctx.fill();
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.font = 'bold 22px "Trebuchet MS"';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  ctx.fillText(startLabel, startBtnX + startBtnW/2, startBtnY + startBtnH/2);
  ctx.restore();
  titleButtons.push({ x: startBtnX, y: startBtnY, w: startBtnW, h: startBtnH, action: 'start' });
  y = startBtnY - 18;

  // press [N] to rename
  ctx.font = '12px "Trebuchet MS"';
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.fillText('press [N] to rename', W/2, y);
  y -= 28;

  // NAMES (large, colored per side) — whole row is tappable to enter rename.
  ctx.font = 'bold 22px "Trebuchet MS"';
  const lname = store.names.left;
  const rname = game.mode === 'versus1p' ? 'CPU' : store.names.right;
  ctx.fillStyle = '#56e2ff';
  ctx.fillText(lname, W/2 - 110, y);
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText('vs', W/2, y);
  ctx.fillStyle = '#ff7ad8';
  ctx.fillText(rname, W/2 + 110, y);
  titleExtras.namesArea = { x: W/2 - 220, y: y - 18, w: 440, h: 36 };

  // Head-to-head record above names (if any matches recorded for this pair)
  const h2h = getH2H(lname, rname);
  if (h2h) {
    y -= 28;
    ctx.font = 'bold 16px "Trebuchet MS"';
    ctx.fillStyle = '#ffe066';
    ctx.fillText('H2H:   ' + h2h.nameA + '  ' + h2h.aWins + '  —  ' + h2h.bWins + '  ' + h2h.nameB, W/2, y);
  }

  // === EASTER EGG (small, just above the multi-choice line on the right) ===
  // Visually small (18px) so it doesn't dominate, but the tap hitbox is a
  // generous 44x44 so it's still easy to find with a thumb.
  const eggSize = 18;
  const eggCX = W - 28;
  const eggCY = (titleExtras.mcToggle ? titleExtras.mcToggle.y : (H - 120)) - eggSize/2 - 4;
  drawEasterEggIcon(eggCX, eggCY, eggSize, t);
  easterEggHitbox = {
    x: eggCX - 22,
    y: eggCY - 22,
    w: 44,
    h: 44,
  };

  ctx.restore();
}

function getAllH2HRecords() {
  // Collect all unique pairs from store.records, aggregating both directions.
  const pairs = {};
  for (const w in store.records) {
    for (const l in store.records[w]) {
      const wins = store.records[w][l] || 0;
      if (wins === 0) continue;
      const sorted = [w, l].sort();
      const key = sorted.join('||');
      pairs[key] = pairs[key] || { a: sorted[0], b: sorted[1], aWins: 0, bWins: 0 };
      if (w === sorted[0]) pairs[key].aWins += wins;
      else pairs[key].bWins += wins;
    }
  }
  return Object.values(pairs);
}

      }
      y += 22 + sec.lines.length * lineH + sectionGap;
    }
  } else {
    // Two-column layout for wide screens
    const startY = 150;
    const lineH = 20;
    const sectionGap = 14;
    const col1X = W * 0.28;
    const col2X = W * 0.72;
    function drawSection(x, sy, sec) {
      ctx.font = 'bold 18px "Trebuchet MS"';
      ctx.fillStyle = '#7fff90';
      ctx.fillText(sec.title, x - 180, sy);
      ctx.font = '14px "Trebuchet MS"';

        ctx.fillText(sec.lines[i], x - 180, sy + 24 + i * lineH);
      }
      return sy + 24 + sec.lines.length * lineH + sectionGap;
    }
    let y1 = startY;
    y1 = drawSection(col1X, y1, sections[0]);
    y1 = drawSection(col1X, y1, sections[1]);
    let y2 = startY;
    y2 = drawSection(col2X, y2, sections[2]);
    y2 = drawSection(col2X, y2, sections[3]);
    y2 = drawSection(col2X, y2, sections[4]);

  const blink = (Math.floor(t * 2) % 2) ? 1 : 0.5;
  ctx.font = 'bold ' + (narrow ? 14 : 18) + 'px "Trebuchet MS"';

  ctx.fillText(narrow ? 'Tap anywhere to go back' : 'Click anywhere or press ESC / SPACE to go back', W/2, H - (narrow ? 22 : 36));

  ctx.restore();
}

  ctx.fillText('Matches played:  ' + (s.gamesPlayed||0), W/2, lifeMPY);

  // HEAD-TO-HEAD block
  const pairs = getAllH2HRecords();
  ctx.font = 'bold ' + (narrow ? 18 : 22) + 'px "Trebuchet MS"';
  ctx.fillStyle = '#ff7ad8';
  ctx.fillText('HEAD TO HEAD', W/2, h2hHdrY);

    ctx.font = 'italic ' + (narrow ? 13 : 16) + 'px "Trebuchet MS"';
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillText(narrow ? 'No matches yet.' : 'No matches yet.  Rename PLAYER 1 / PLAYER 2 (press N on title)', W/2, h2hHdrY + 32);
    ctx.fillText(narrow ? 'Play a versus match to fill this in.' : 'and play a versus match — your record shows up here.', W/2, h2hHdrY + 56);
  } else {
    pairs.sort((p1, p2) => (p2.aWins + p2.bWins) - (p1.aWins + p1.bWins));
    ctx.font = 'bold ' + (narrow ? 17 : 20) + 'px "Trebuchet MS"';
    const colOffset = narrow ? 50 : 60;
    const maxRows = narrow ? Math.min(pairs.length, 6) : Math.min(pairs.length, 8);
    for (let i = 0; i < maxRows; i++) {
      const p = pairs[i];
      const aLead = p.aWins > p.bWins;
      const bLead = p.bWins > p.aWins;
      const yy = h2hStartY + i * h2hLineH;
      ctx.textAlign = 'right';
      ctx.fillStyle = aLead ? '#7fff90' : '#fff';
      ctx.fillText(p.a, W/2 - colOffset, yy);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffe066';
      ctx.fillText(p.aWins + '  —  ' + p.bWins, W/2, yy);
      ctx.textAlign = 'left';
      ctx.fillStyle = bLead ? '#7fff90' : '#fff';
      ctx.fillText(p.b, W/2 + colOffset, yy);
    }
    if (pairs.length > maxRows) {
      ctx.font = 'italic 13px "Trebuchet MS"';
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.fillText('+ ' + (pairs.length - maxRows) + ' more pairs', W/2, h2hStartY + maxRows * h2hLineH + 12);
    }
  }

  // Footer
  const t = performance.now() / 1000;
  const blink = (Math.floor(t * 2) % 2) ? 1 : 0.5;
  ctx.font = 'bold ' + (narrow ? 14 : 18) + 'px "Trebuchet MS"';
  ctx.textAlign = 'center';

  ctx.fillText(narrow ? 'Tap anywhere to go back' : 'Click anywhere or press ESC / SPACE to go back', W/2, H - (narrow ? 22 : 36));

  ctx.restore();
}

  ctx.fillStyle = '#fff';

  const words = EASTER_MESSAGE.split(' ');

  for (const word of words) {
    const test = currentLine ? currentLine + ' ' + word : word;

  // Center the block vertically in the available middle area

    ctx.font = 'bold 17px "Trebuchet MS"';
    ctx.fillStyle = '#ffe066';
    ctx.fillText('H2H:   ' + h2h.nameA + '  ' + h2h.aWins + '  —  ' + h2h.bWins + '  ' + h2h.nameB, W/2, H/2 + 73);
  }

  // Personalized phrases for named players (e.g. MIMI, TREY)
  let pressSpaceY = H/2 + 160;
  if (game.gameOverPhrases) {
    let phraseY = H/2 + 105;
    if (game.gameOverPhrases.winPhrase) {
      ctx.font = 'italic bold 22px "Trebuchet MS"';
      ctx.fillStyle = accent;
      ctx.shadowColor = accent;
      ctx.shadowBlur = 12;
      ctx.fillText('“' + game.gameOverPhrases.winPhrase + '”', W/2, phraseY);
      ctx.shadowBlur = 0;
      phraseY += 32;
    }
    if (game.gameOverPhrases.losePhrase) {
      ctx.font = 'italic 18px "Trebuchet MS"';
      ctx.fillStyle = 'rgba(255,180,180,0.75)';
      ctx.fillText('“' + game.gameOverPhrases.losePhrase + '”', W/2, phraseY);
      phraseY += 28;
    }
    if (game.gameOverPhrases.winPhrase || game.gameOverPhrases.losePhrase) {
      pressSpaceY = phraseY + 30;
    }
  }

  const t = performance.now() / 1000;
  const blink = (Math.floor(t * 2) % 2) ? 1 : 0.5;
  if (game.pongEarned) {
    // Bonus Pong unlocked — celebratory prompt instead of the normal continue.
    ctx.font = 'bold 22px "Trebuchet MS"';
    ctx.fillStyle = '#7fff90';
    ctx.shadowColor = '#7fff90';
    ctx.shadowBlur = 18;
    ctx.fillText('15-CORRECT BONUS!', W/2, pressSpaceY - 10);
    ctx.shadowBlur = 0;
    ctx.font = 'bold 26px "Trebuchet MS"';
    ctx.fillStyle = 'rgba(127,255,144,' + blink + ')';
    ctx.fillText('TAP / SPACE  →  PLAY PONG', W/2, pressSpaceY + 26);
    ctx.font = '13px "Trebuchet MS"';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText('(ESC to skip and return to menu)', W/2, pressSpaceY + 56);
  } else {
    ctx.font = 'bold 28px "Trebuchet MS"';
    ctx.fillStyle = 'rgba(255,255,255,' + blink + ')';
    ctx.fillText('PRESS  SPACE  TO  CONTINUE', W/2, pressSpaceY);
  }
  ctx.restore();
}

function drawToast() {
  if (game.toast.t <= 0) return;
  const t = game.toast.t;
  const a = clamp(t / 0.4, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.font = 'bold 56px "Trebuchet MS"';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = game.toast.color;
  ctx.shadowColor = game.toast.color;
  ctx.shadowBlur = 24;
  const yOff = (1 - a) * 30;
  ctx.fillText(game.toast.text, W/2, H * 0.32 + yOff);
  ctx.restore();
}

// ======= SPECTACLE EFFECTS =======
function drawEffectsBack() {
  for (const e of game.effects) {
    if (e.kind === 'aurora') drawAurora(e);
  }
}
function drawEffectsFront() {
  for (const e of game.effects) {
    if (e.kind === 'lightning') drawLightning(e);
    else if (e.kind === 'volcano') drawVolcano(e);
    else if (e.kind === 'tornado') drawTornado(e);
    else if (e.kind === 'meteor') drawMeteor(e);
  }
}

function drawLightning(e) {
  const dur = 1.6;
  const k = clamp(e.t / dur, 0, 1);
  if (k > 1) return;
  const flicker = Math.random() < (k < 0.5 ? 0.7 : 0.3);
  if (!flicker && k > 0.1) return;
  ctx.save();
  ctx.globalAlpha = (1 - k) * 0.95;
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(0, 0, W, H);

  const bolts = 3 + Math.floor(Math.random() * 4);
  for (let b = 0; b < bolts; b++) {
    const startX = randF(W * 0.1, W * 0.9);
    let x = startX, y = 0;
    ctx.strokeStyle = 'rgba(220,240,255,0.95)';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#aef';
    ctx.shadowBlur = 24;
    ctx.beginPath();
    ctx.moveTo(x, y);
    while (y < H) {
      x += randF(-40, 40);
      y += randF(20, 60);
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function drawVolcano(e) {
  const dur = 1.6;
  const k = clamp(e.t / dur, 0, 1);
  if (k > 1) return;
  const sources = [W * 0.25, W * 0.5, W * 0.75];
  if (e.t < 0.05 || Math.random() < 0.6) {
    for (const sx of sources) {
      for (let i = 0; i < 6; i++) {
        const a = randF(-Math.PI*0.35, -Math.PI*0.65) - Math.PI/2 + Math.PI;
        const speed = randF(400, 900);
        game.particles.push({
          x: sx + randF(-30, 30), y: H - 4,
          vx: Math.cos(a) * speed,
          vy: Math.sin(a) * speed * 0.7 - randF(400, 900),
          life: randF(0.8, 1.6), maxLife: 1.6, r: randF(3, 8),
          color: pick(['#ff5722', '#ffcc00', '#ff8800', '#ffeb3b']),
          gravity: 700,
        });
      }
    }
  }
  ctx.save();
  const glow = ctx.createRadialGradient(W/2, H, 10, W/2, H, H * 0.6);
  glow.addColorStop(0, 'rgba(255,140,40,' + (0.5 * (1 - k)) + ')');
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

function drawTornado(e) {
  const dur = 1.7;
  const k = clamp(e.t / dur, 0, 1);
  if (k > 1) return;
  const cx = W * (e.side === 'left' ? 0.3 : 0.7);
  const baseY = H * 0.85;
  ctx.save();
  ctx.globalAlpha = 0.85 * (1 - k * 0.4);
  for (let i = 0; i < 60; i++) {
    const yy = baseY - i * 12;
    const wob = Math.sin(e.t * 8 + i * 0.3) * (i * 1.6);
    const w = 18 + i * 1.4;
    const x = cx + wob;
    ctx.fillStyle = 'rgba(180,200,220,' + (0.05 + (i % 4) * 0.04) + ')';
    ctx.beginPath();
    ctx.ellipse(x, yy, w, 6, 0, 0, TAU);
    ctx.fill();
  }
  for (let i = 0; i < 40; i++) {
    const ang = e.t * 5 + i;
    const r = 30 + ((i * 17) % 80);
    const px = cx + Math.cos(ang) * r;
    const py = baseY - (i * 11) % 480 + Math.sin(ang) * 6;
    ctx.fillStyle = 'rgba(220,220,220,0.7)';
    ctx.fillRect(px, py, 2, 2);
  }
  ctx.restore();
}

function drawMeteor(e) {
  const dur = 1.6;
  const k = clamp(e.t / dur, 0, 1);
  if (k > 1) return;
  if (Math.random() < 0.7) {
    for (let i = 0; i < 2; i++) {
      const sx = randF(0, W);
      game.particles.push({
        x: sx, y: -20,
        vx: randF(-200, -400), vy: randF(700, 1100),
        life: 1.0, maxLife: 1.0, r: 5,
        color: pick(['#fff', '#ffe066', '#ffaa44']),
        gravity: 0,
      });
    }
  }
}

function drawAurora(e) {
  const dur = 3.2;
  const k = clamp(e.t / dur, 0, 1);
  if (k > 1) return;
  ctx.save();
  ctx.globalAlpha = Math.sin(k * Math.PI) * 0.6;
  for (let band = 0; band < 4; band++) {
    const grad = ctx.createLinearGradient(0, 0, W, H);
    grad.addColorStop(0, 'rgba(80,255,180,0)');
    grad.addColorStop(0.5, ['rgba(80,255,180,0.5)', 'rgba(120,160,255,0.5)', 'rgba(255,150,220,0.4)', 'rgba(180,255,80,0.4)'][band]);
    grad.addColorStop(1, 'rgba(80,255,180,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    const yBase = H * (0.15 + band * 0.18);
    ctx.moveTo(0, yBase);
    for (let x = 0; x <= W; x += 20) {
      const yy = yBase + Math.sin((x * 0.005) + e.t * 2 + band) * 60;
      ctx.lineTo(x, yy);
    }
    ctx.lineTo(W, yBase + 60);
    ctx.lineTo(0, yBase + 60);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

// boot
resize();
window.addEventListener('resize', resize);
requestAnimationFrame(loop);
</script>
