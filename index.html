function drawEasterEggIcon(cx, cy, size, t) {
  ctx.save();
  // Gentle pulse so the eye catches it
  const pulse = 0.85 + 0.15 * Math.sin(t * 1.8);
  ctx.globalAlpha = pulse;

  // Egg body — oval, slightly more vertical than horizontal
  ctx.fillStyle = '#fff5d6';
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.ellipse(cx, cy, size * 0.42, size * 0.55, 0, 0, TAU);
  ctx.fill();
  ctx.stroke();

  // Two decorative bands (zigzag-ish stripes)
  ctx.strokeStyle = '#ff7ad8';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(cx - size * 0.36, cy - size * 0.08);
  ctx.lineTo(cx - size * 0.12, cy - size * 0.18);
  ctx.lineTo(cx + size * 0.12, cy - size * 0.08);
  ctx.lineTo(cx + size * 0.36, cy - size * 0.18);
  ctx.stroke();
  ctx.strokeStyle = '#56e2ff';
  ctx.beginPath();
  ctx.moveTo(cx - size * 0.36, cy + size * 0.18);
  ctx.lineTo(cx - size * 0.12, cy + size * 0.08);
  ctx.lineTo(cx + size * 0.12, cy + size * 0.18);
  ctx.lineTo(cx + size * 0.36, cy + size * 0.08);
  ctx.stroke();

  // Dots between bands
  ctx.fillStyle = '#7fff90';
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath();
    ctx.arc(cx + i * size * 0.22, cy + size * 0.32, 1.6, 0, TAU);
    ctx.fill();
  }

  ctx.restore();
}

function getAllH2HRecords() {
  // Collect all unique pairs from store.records, aggregating both directions.
  const pairs = {};
  for (const w in store.records) {
    for (const l in store.records[w]) {
      const wins = store.records[w][l] || 0;
      if (wins === 0) continue;
      const sorted = [w, l].sort();
      const key = sorted.join('||');
      pairs[key] = pairs[key] || { a: sorted[0], b: sorted[1], aWins: 0, bWins: 0 };
      if (w === sorted[0]) pairs[key].aWins += wins;
      else pairs[key].bWins += wins;
    }
  }
  return Object.values(pairs);
}

  // a suggested name (TREY / MIMI). Show a hint so the user knows they can
  // accept or change it.
  if (ne.thenAction === 'startGame' && ne.suggested) {
    ctx.font = 'bold 15px "Trebuchet MS"';
    ctx.fillStyle = '#ffe066';
    ctx.fillText(
      ne.side === 'left'
        ? 'Suggested:  TREY     (Enter to accept, or Backspace to change)'
        : 'Suggested:  MIMI     (Enter to accept, or Backspace to change)',
      W/2, H/2 - 150);
  }
  ctx.restore();
}

function drawCustomSetup() {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.85)';
  ctx.fillRect(0, 0, W, H);

  const t = performance.now() / 1000;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // === TOP: header ===
  ctx.font = 'bold 56px "Trebuchet MS"';
  ctx.fillStyle = '#7fff90';
  ctx.shadowColor = '#7fff90';
  ctx.shadowBlur = 24;
  ctx.fillText('CUSTOM', W/2, 80);
  ctx.shadowBlur = 0;

  ctx.font = '14px "Trebuchet MS"';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText('Pick the math you want to practice. Press number keys to toggle.', W/2, 122);

  // === MIDDLE: op list (centered, left-aligned within the group) ===
  ctx.font = 'bold 22px "Trebuchet MS"';
  ctx.textAlign = 'left';
  const opStartX = W/2 - 200;
  const opStartY = 165;
  const lineH = 34;
  for (let i = 0; i < CUSTOM_OPS_ORDER.length; i++) {
    const op = CUSTOM_OPS_ORDER[i];
    const on = !!game.customSetup.ops[op];
    const y = opStartY + i * lineH;
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fillText('[' + (i + 1) + ']', opStartX - 55, y);
    ctx.fillStyle = on ? '#7fff90' : 'rgba(255,255,255,0.25)';
    ctx.fillText(on ? '[✓]' : '[ ]', opStartX, y);
    ctx.fillStyle = on ? '#fff' : 'rgba(255,255,255,0.4)';
    ctx.fillText(CUSTOM_OP_LABELS[op], opStartX + 60, y);
  }

  // === BOTTOM-ANCHORED: difficulty, hints, help ===
  // (Anchored from H so the layout breathes the same on any window height.)
  ctx.textAlign = 'center';

  // Help text at very bottom
  ctx.font = '12px "Trebuchet MS"';
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.fillText('Custom mode: solo, no scoring, no auto-leveling.', W/2, H - 30);

  // Keyboard hints above help
  const blink = (Math.floor(t * 2) % 2) ? 1 : 0.5;
  ctx.font = 'bold 16px "Trebuchet MS"';
  ctx.fillStyle = 'rgba(255,255,255,' + blink + ')';
  ctx.fillText('SPACE  start   •   ESC  back   •   1-6  toggle   •   ◀▶  difficulty', W/2, H - 65);

  // Difficulty section, with breathing room above the hints
  const diffValueY = H - 130;
  const diffLabelY = diffValueY - 36;

  ctx.font = 'bold 13px "Trebuchet MS"';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText('◀ ▶   DIFFICULTY (number magnitudes)', W/2, diffLabelY);

  ctx.font = 'bold 22px "Trebuchet MS"';
  const dColor = ['#7fff90', '#a5e264', '#ffe066', '#ff9d50', '#ff5577'][game.customSetup.difficulty - 1];
  ctx.fillStyle = dColor;
  ctx.shadowColor = dColor;
  ctx.shadowBlur = 14;
  const dLabel = (game.customSetup.difficulty) + '.   ' + CUSTOM_DIFF_LABELS[game.customSetup.difficulty - 1];
  ctx.fillText(dLabel, W/2, diffValueY);
  ctx.shadowBlur = 0;

  ctx.restore();
}

function drawPracticeMenu() {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, W, H);

  const t = performance.now() / 1000;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = 'bold 80px "Trebuchet MS"';
  ctx.fillStyle = '#ffe066';
  ctx.shadowColor = '#ffe066';
  ctx.shadowBlur = 32;
  ctx.fillText('PRACTICE', W/2, H/2 - 150);
  ctx.shadowBlur = 0;

  ctx.font = '18px "Trebuchet MS"';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText('No scoring, no opponent. Just rapid problems with a streak counter.', W/2, H/2 - 90);
  ctx.fillText('Time pressure still applies — but the digit floor keeps it fair.', W/2, H/2 - 64);

  // Op cycler
  ctx.font = 'bold 32px "Trebuchet MS"';
  const arrowBlink = (Math.floor(t * 2.5) % 2) ? 1 : 0.55;
  ctx.fillStyle = 'rgba(255,255,255,' + arrowBlink + ')';
  ctx.fillText('◀', W/2 - 240, H/2 + 20);
  ctx.fillText('▶', W/2 + 240, H/2 + 20);

  ctx.font = 'bold 36px "Trebuchet MS"';
  ctx.fillStyle = '#7fff90';
  ctx.shadowColor = '#7fff90';
  ctx.shadowBlur = 18;
  ctx.fillText(PRACTICE_OP_LABELS[game.practiceOp], W/2, H/2 + 20);
  ctx.shadowBlur = 0;

  ctx.font = 'bold 20px "Trebuchet MS"';
  const blink = (Math.floor(t * 2) % 2) ? 1 : 0.5;
  ctx.fillStyle = 'rgba(255,255,255,' + blink + ')';
  ctx.fillText('SPACE  to start   •   ESC  to back', W/2, H/2 + 110);
  ctx.restore();
}

function drawGameOver() {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, W, H);

  const winner = game.winnerSide === 'left' ? game.paddleL : game.paddleR;
  const accent = game.winnerSide === 'left' ? '#56e2ff' : '#ff7ad8';
  const loserAccent = game.winnerSide === 'left' ? '#ff7ad8' : '#56e2ff';

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 120px "Trebuchet MS"';
  ctx.shadowColor = accent;
  ctx.shadowBlur = 40;
  ctx.fillStyle = accent;
  ctx.fillText(winner.name + ' WINS!', W/2, H/2 - 130);

  ctx.shadowBlur = 0;
  ctx.font = 'bold 40px "Trebuchet MS"';
  ctx.fillStyle = '#fff';
  ctx.fillText(game.score.left + '  —  ' + game.score.right, W/2, H/2 - 40);

  ctx.font = '20px "Trebuchet MS"';
  ctx.fillStyle = '#ffe066';
  ctx.fillText(game.totalCorrect + ' problems solved this match   •   best streak ' + game.matchBestStreak, W/2, H/2 + 10);

  // Lifetime
  const s = store.stats;
  ctx.font = '15px "Trebuchet MS"';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText('LIFETIME:  ' + (s.totalSolved||0) + ' solved   •   best streak ' + (s.bestStreak||0) + '   •   ' + (s.gamesPlayed||0) + ' matches', W/2, H/2 + 45);

  // Head-to-head record for this pair (now updated with the just-finished match)
  const h2h = getH2H(game.paddleL.name, game.paddleR.name);
  if (h2h) {
    ctx.font = 'bold 17px "Trebuchet MS"';
    ctx.fillStyle = '#ffe066';
    ctx.fillText('H2H:   ' + h2h.nameA + '  ' + h2h.aWins + '  —  ' + h2h.bWins + '  ' + h2h.nameB, W/2, H/2 + 73);
  }

  // Personalized phrases for named players (e.g. MIMI, TREY)
  let pressSpaceY = H/2 + 160;
  if (game.gameOverPhrases) {
    let phraseY = H/2 + 105;
    if (game.gameOverPhrases.winPhrase) {
      ctx.font = 'italic bold 22px "Trebuchet MS"';
      ctx.fillStyle = accent;
      ctx.shadowColor = accent;
      ctx.shadowBlur = 12;
      ctx.fillText('“' + game.gameOverPhrases.winPhrase + '”', W/2, phraseY);
      ctx.shadowBlur = 0;
      phraseY += 32;
    }
    if (game.gameOverPhrases.losePhrase) {
      ctx.font = 'italic 18px "Trebuchet MS"';
      ctx.fillStyle = 'rgba(255,180,180,0.75)';
      ctx.fillText('“' + game.gameOverPhrases.losePhrase + '”', W/2, phraseY);
      phraseY += 28;
    }
    if (game.gameOverPhrases.winPhrase || game.gameOverPhrases.losePhrase) {
      pressSpaceY = phraseY + 30;
    }
  }

  const t = performance.now() / 1000;
  const blink = (Math.floor(t * 2) % 2) ? 1 : 0.5;
  ctx.font = 'bold 28px "Trebuchet MS"';
  ctx.fillStyle = 'rgba(255,255,255,' + blink + ')';
  ctx.fillText('PRESS  SPACE  TO  CONTINUE', W/2, pressSpaceY);
  ctx.restore();
}

function drawToast() {
  if (game.toast.t <= 0) return;
  const t = game.toast.t;
  const a = clamp(t / 0.4, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.font = 'bold 56px "Trebuchet MS"';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = game.toast.color;
  ctx.shadowColor = game.toast.color;
  ctx.shadowBlur = 24;
  const yOff = (1 - a) * 30;
  ctx.fillText(game.toast.text, W/2, H * 0.32 + yOff);
  ctx.restore();
}

// ======= SPECTACLE EFFECTS =======
function drawEffectsBack() {
  for (const e of game.effects) {
    if (e.kind === 'aurora') drawAurora(e);
  }
}
function drawEffectsFront() {
  for (const e of game.effects) {
    if (e.kind === 'lightning') drawLightning(e);
    else if (e.kind === 'volcano') drawVolcano(e);
    else if (e.kind === 'tornado') drawTornado(e);
    else if (e.kind === 'meteor') drawMeteor(e);
  }
}

function drawLightning(e) {
  const dur = 1.6;
  const k = clamp(e.t / dur, 0, 1);
  if (k > 1) return;
  const flicker = Math.random() < (k < 0.5 ? 0.7 : 0.3);
  if (!flicker && k > 0.1) return;
  ctx.save();
  ctx.globalAlpha = (1 - k) * 0.95;
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(0, 0, W, H);

  const bolts = 3 + Math.floor(Math.random() * 4);
  for (let b = 0; b < bolts; b++) {
    const startX = randF(W * 0.1, W * 0.9);
    let x = startX, y = 0;
    ctx.strokeStyle = 'rgba(220,240,255,0.95)';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#aef';
    ctx.shadowBlur = 24;
    ctx.beginPath();
    ctx.moveTo(x, y);
    while (y < H) {
      x += randF(-40, 40);
      y += randF(20, 60);
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function drawVolcano(e) {
  const dur = 1.6;
  const k = clamp(e.t / dur, 0, 1);
  if (k > 1) return;
  const sources = [W * 0.25, W * 0.5, W * 0.75];
  if (e.t < 0.05 || Math.random() < 0.6) {
    for (const sx of sources) {
      for (let i = 0; i < 6; i++) {
        const a = randF(-Math.PI*0.35, -Math.PI*0.65) - Math.PI/2 + Math.PI;
        const speed = randF(400, 900);
        game.particles.push({
          x: sx + randF(-30, 30), y: H - 4,
          vx: Math.cos(a) * speed,
          vy: Math.sin(a) * speed * 0.7 - randF(400, 900),
          life: randF(0.8, 1.6), maxLife: 1.6, r: randF(3, 8),
          color: pick(['#ff5722', '#ffcc00', '#ff8800', '#ffeb3b']),
          gravity: 700,
        });
      }
    }
  }
  ctx.save();
  const glow = ctx.createRadialGradient(W/2, H, 10, W/2, H, H * 0.6);
  glow.addColorStop(0, 'rgba(255,140,40,' + (0.5 * (1 - k)) + ')');
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

function drawTornado(e) {
  const dur = 1.7;
  const k = clamp(e.t / dur, 0, 1);
  if (k > 1) return;
  const cx = W * (e.side === 'left' ? 0.3 : 0.7);
  const baseY = H * 0.85;
  ctx.save();
  ctx.globalAlpha = 0.85 * (1 - k * 0.4);
  for (let i = 0; i < 60; i++) {
    const yy = baseY - i * 12;
    const wob = Math.sin(e.t * 8 + i * 0.3) * (i * 1.6);
    const w = 18 + i * 1.4;
    const x = cx + wob;
    ctx.fillStyle = 'rgba(180,200,220,' + (0.05 + (i % 4) * 0.04) + ')';
    ctx.beginPath();
    ctx.ellipse(x, yy, w, 6, 0, 0, TAU);
    ctx.fill();
  }
  for (let i = 0; i < 40; i++) {
    const ang = e.t * 5 + i;
    const r = 30 + ((i * 17) % 80);
    const px = cx + Math.cos(ang) * r;
    const py = baseY - (i * 11) % 480 + Math.sin(ang) * 6;
    ctx.fillStyle = 'rgba(220,220,220,0.7)';
    ctx.fillRect(px, py, 2, 2);
  }
  ctx.restore();
}

function drawMeteor(e) {
  const dur = 1.6;
  const k = clamp(e.t / dur, 0, 1);
  if (k > 1) return;
  if (Math.random() < 0.7) {
    for (let i = 0; i < 2; i++) {
      const sx = randF(0, W);
      game.particles.push({
        x: sx, y: -20,
        vx: randF(-200, -400), vy: randF(700, 1100),
        life: 1.0, maxLife: 1.0, r: 5,
        color: pick(['#fff', '#ffe066', '#ffaa44']),
        gravity: 0,
      });
    }
  }
}

function drawAurora(e) {
  const dur = 3.2;
  const k = clamp(e.t / dur, 0, 1);
  if (k > 1) return;
  ctx.save();
  ctx.globalAlpha = Math.sin(k * Math.PI) * 0.6;
  for (let band = 0; band < 4; band++) {
    const grad = ctx.createLinearGradient(0, 0, W, H);
    grad.addColorStop(0, 'rgba(80,255,180,0)');
    grad.addColorStop(0.5, ['rgba(80,255,180,0.5)', 'rgba(120,160,255,0.5)', 'rgba(255,150,220,0.4)', 'rgba(180,255,80,0.4)'][band]);
    grad.addColorStop(1, 'rgba(80,255,180,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    const yBase = H * (0.15 + band * 0.18);
    ctx.moveTo(0, yBase);
    for (let x = 0; x <= W; x += 20) {
      const yy = yBase + Math.sin((x * 0.005) + e.t * 2 + band) * 60;
      ctx.lineTo(x, yy);
    }
    ctx.lineTo(W, yBase + 60);
    ctx.lineTo(0, yBase + 60);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

// boot
resize();
window.addEventListener('resize', resize);
requestAnimationFrame(loop);
</script>
